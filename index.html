<title>Route Nette</title>
<style>
:root{
  --bg:#0d1a14;--bg2:#12241b;--card:#18301f;--card2:#1f3b29;--line:#2c4d37;--tx:#f2f7f3;--mut:#a3bcaa;
  --or:#ff9a1f;--or2:#ffb84d;--gr:#4fdc7a;--gr2:#2fb35a;--rd:#ff5d57;--bl:#4fb3ff;--ye:#ffd23f;--vi:#b48cff;
  --sh:0 6px 20px rgba(0,0,0,.35);--r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:600 15px/1.35 Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;max-width:760px;margin:auto;background:linear-gradient(180deg,#0d1a14,#0a140f)}
button{font-family:inherit}
/* --- En-tête --- */
#top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:linear-gradient(180deg,#14281d,#0f2017);border-bottom:1px solid var(--line)}
#logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--or),#ff6a00);display:grid;place-items:center;font-weight:900;color:#2a1600;font-size:15px;box-shadow:0 3px 10px rgba(255,140,0,.35);flex:none}
#tinfo{flex:1;min-width:0}
#tname{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tsub{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cash{background:linear-gradient(135deg,#1f4d2e,#16371f);border:1px solid #2f7a45;border-radius:12px;padding:5px 10px;font-weight:900;font-size:17px;color:#b9ffd0;white-space:nowrap}
#cash.neg{background:linear-gradient(135deg,#5a1f1d,#3b1412);border-color:#9b3a35;color:#ffc2bd}
/* --- Barre de scène --- */
#scene{position:relative}
#cv{width:100%;height:230px;display:block;touch-action:manipulation;background:#7fb8e8}
#hud{position:absolute;left:8px;right:150px;top:8px;flex-direction:column;align-items:flex-start;display:flex;gap:6px;align-items:center;pointer-events:none}
.pill{background:rgba(8,18,13,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:800;white-space:nowrap}
#hudJob{max-width:100%;overflow:hidden;text-overflow:ellipsis}
#speed{position:absolute;right:8px;top:8px;display:flex;gap:4px;background:rgba(8,18,13,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:12px;padding:3px;border:1px solid rgba(255,255,255,.12)}
#speed button{background:none;border:0;color:#fff;font-size:12px;font-weight:900;padding:5px 7px;border-radius:9px;letter-spacing:-2px}
#speed button.on{background:var(--or);color:#2a1600}
#prog{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.4);overflow:hidden;display:none}
#prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gr2),var(--gr));box-shadow:0 0 8px var(--gr)}
/* --- Contenu --- */
#pane{flex:1;overflow-y:auto;padding:12px 12px 24px;-webkit-overflow-scrolling:touch}
.card{background:linear-gradient(180deg,var(--card),#152a1c);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;box-shadow:var(--sh);position:relative;overflow:hidden}
.card.acc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ac,var(--or))}
.card h3{margin:0;font-size:16.5px;font-weight:900;line-height:1.2}
.hd{display:flex;gap:10px;align-items:center}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none;background:var(--ac2,#2b4a35)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px;font-weight:600}
.sm{font-size:12.5px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:4px;background:#24402e;border-radius:8px;padding:3px 8px;font-size:12.5px;font-weight:800}
.tag.g{background:#1d5232;color:#b6f7c9}.tag.r{background:#5b2322;color:#ffc0bb}.tag.o{background:#5c3a0e;color:#ffd79a}.tag.b{background:#173f5e;color:#bfe3ff}.tag.v{background:#3d2c66;color:#dccbff}
.btn{appearance:none;border:0;border-radius:12px;padding:10px 16px;font-weight:900;font-size:15px;color:#2a1600;background:linear-gradient(180deg,var(--or2),var(--or));box-shadow:0 3px 0 #b8630a,0 6px 14px rgba(255,140,0,.25);cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b8630a}
.btn.s{background:linear-gradient(180deg,#2f5139,#264430);color:var(--tx);box-shadow:0 3px 0 #18301f}
.btn.g{background:linear-gradient(180deg,#6cf094,var(--gr2));color:#06230f;box-shadow:0 3px 0 #1d7a3c}
.btn.r{background:linear-gradient(180deg,#ff7f79,var(--rd));color:#fff;box-shadow:0 3px 0 #a3302b}
.btn.w{width:100%}
.btn:disabled{opacity:.42;filter:saturate(.4);box-shadow:none}
.bar{height:10px;background:#0b170f;border-radius:6px;overflow:hidden;margin:8px 0 4px;border:1px solid #23402d}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gr2),var(--gr));border-radius:6px}
.money{color:var(--gr);font-weight:900}.neg{color:var(--rd);font-weight:900}
h2{font-size:12.5px;color:var(--mut);margin:16px 4px 8px;text-transform:uppercase;letter-spacing:.08em;font-weight:900}
.req{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:12.5px}
.goal{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,#3b2a0a,#2a1f0b);border:1px solid #7a5418;border-radius:var(--r);padding:10px 12px;margin-bottom:12px}
.goal b{color:var(--ye)}
.goal .gi{font-size:26px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi div{background:#132619;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.kpi b{display:block;font-size:17px;font-weight:900}
.kpi span{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:6px 2px;border-bottom:1px solid var(--line)}td:last-child{text-align:right;font-weight:800}
/* --- Onglets --- */
nav{display:flex;background:#0b1711;border-top:1px solid var(--line);padding:4px 4px calc(env(safe-area-inset-bottom) + 4px)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:5px 0 4px;font-size:10.5px;font-weight:800;position:relative;min-width:0;border-radius:12px}
nav button b{display:block;font-size:21px;line-height:1.15;filter:grayscale(.5);opacity:.85}
nav button.on{color:var(--or2);background:#1a3022}
nav button.on b{filter:none;opacity:1;transform:scale(1.08)}
nav .bd{position:absolute;top:1px;right:calc(50% - 22px);background:var(--rd);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;font-weight:900;min-width:16px}
/* --- Fenêtres --- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:40;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#modal.on{display:flex}
#modal .box{background:linear-gradient(180deg,#1c3626,#132619);width:100%;max-width:760px;max-height:90dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);border-top:3px solid var(--or);animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
#modal h3{margin:0 0 10px;font-size:20px;font-weight:900}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#203a29;border-radius:20px;padding:7px 11px;margin:3px;font-size:14px;font-weight:800}
.chip.on{background:var(--gr);color:#06230f;border-color:var(--gr)}
input[type=range]{width:100%;accent-color:var(--or);height:28px}
input[type=text],textarea{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:#0b170f;color:var(--tx);font:700 16px Nunito,system-ui,sans-serif}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 78px);transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px;width:94%;max-width:520px;pointer-events:none}
#toast div{background:rgba(14,30,21,.96);border:1px solid var(--or);border-radius:14px;padding:9px 13px;animation:tin .3s;box-shadow:var(--sh);font-size:14px}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.log div{padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.big{font-size:28px;font-weight:900}
/* --- Accueil --- */
#splash{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;
  background:radial-gradient(120% 80% at 50% 0%,#2f7a45 0%,#163a24 45%,#0b1711 100%)}
#splash h1{margin:0;font-size:46px;font-weight:900;letter-spacing:-.02em;line-height:1;background:linear-gradient(180deg,#fff,#ffd79a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 6px 30px rgba(255,160,40,.25)}
#splash p{margin:0;color:#cfe6d6;font-size:15px;max-width:340px}
#splash .btn{min-width:230px;font-size:18px;padding:14px 20px}
#splash .ver{font-size:12px;color:var(--mut);margin-top:6px}
/* --- Installation et mises à jour --- */
#upd,#ins{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:60;display:none;align-items:center;gap:10px;background:#1c3626;border:1px solid var(--or);color:var(--tx);border-radius:16px;padding:10px 12px;box-shadow:var(--sh);max-width:736px;margin:auto}
#upd.on,#ins.on{display:flex}#upd>div,#ins>div{flex:1}#upd small,#ins small{display:block;font-weight:600;opacity:.85;font-size:13px}
#ins .x{background:transparent;color:var(--tx);border:0;font-size:18px;padding:8px}
.seg{display:flex;gap:4px;background:#0f1f15;border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;background:none;border:0;color:var(--mut);font:800 13px Nunito,sans-serif;padding:8px 4px;border-radius:10px}
.seg button.on{background:var(--card2);color:var(--or2)}
.poste{border-bottom:1px solid var(--line);padding:8px 0}
.poste input{width:92px;padding:7px;border-radius:9px;border:1px solid var(--line);background:#0b170f;color:var(--tx);font:800 15px Nunito,sans-serif;text-align:right}
.mini{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#24402e;color:var(--tx);font:900 18px Nunito,sans-serif}
</style>
</head>
<body>

  <div id="tinfo"><div id="tname"></div><div id="tsub"></div></div>

<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)];

const nb1=n=>(+n).toLocaleString('fr-BE',{maximumFractionDigits:1});
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const WDM=21.7; // jours ouvrables par mois

/* =====================================================================
   DONNÉES — prix HTVA relevés sur le marché belge (annonces d'occasion 2025-2026,
   barèmes CP 124, salaires moyens). Voir CLAUDE.md pour les sources.
   ===================================================================== */

const EQ={
  taillehaie:{n:'Taille-haie thermique pro',ic:'✂️',p:620,u:4},
  souffleur:{n:'Souffleur à dos pro',ic:'🍃',p:690,u:4},

};
// Agréation des entrepreneurs (marchés de travaux > 75 000 € HTVA), montants de l'AR du 14 avril 2024
const CLS=[{max:75000,n:'Sans agréation'},
  {max:819000,c:181.5,ca:100000,w:5,r:30,n:'Classe 1'},
  {max:2640000,c:605,ca:600000,w:14,r:50,dir:['dirt','daf'],n:'Classe 2'}];

const ROLES={
  boss:{n:'Patron',ic:'⭐',cat:'ouv',day:0},
  etu:{n:'Étudiant jobiste',ic:'🎒',cat:'ouv',day:118,sk:[.6,.8],d:'Pas cher, mais moins efficace.'},

  metreur:{n:'Métreur-deviseur',ic:'📐',cat:'bur',day:238,who:'Olivier Gérard',d:'Calcule ton prix de revient exact pour chaque marché. +2 offres en même temps.'},
  gest:{n:'Gestionnaire de chantier',ic:'📋',cat:'enc',day:265,multi:1,d:'Suit 3 chantiers de plus en même temps.'},

};
const GESTN=['Christophe Hubert','Fanny Leclercq','Didier Massart','Julie Wautier','Kevin Jacquet','Laurent Pirotte','Céline Dethier','Nicolas Gillard'];
// Travaux. rate = quantité par jour ouvrable pour un ouvrier normal ; pu = prix unitaire de référence HTVA.
// p:1 = petit boulot privé ; sinon marché public. pc:1 = permis C nécessaire. nat = nature du marché.

function migrate(s){const d=defaults();
  for(const k in d)if(s[k]===undefined)s[k]=d[k];
  for(const k in d.stats)if(s.stats[k]===undefined)s.stats[k]=d.stats[k];
  if(!s.riv)s.riv=newRivals();
  // version 1 -> 2 : nouveaux métiers, marchés au format belge
  if((s.schema||1)<2){
    s.workers.forEach(w=>{if(w.boss){w.r='boss';w.day=0}else{w.r=w.ty==='Étudiant jobiste'?'etu':w.ty==='Ouvrier expérimenté'?'qual':'man';w.day=ROLES[w.r].day}delete w.sal;delete w.ty});
    s.tenders=[];s.cand=[];
    s.contracts.forEach(c=>{if(!JOBS[c.j]||JOBS[c.j].p)return;c.N=c.N||Math.max(10,c.deadline-s.day);c.wd=0;c.billed=c.paid||0;c.caut=0});
  }
  // éléments retirés : remboursés plutôt que perdus
  for(const k in s.eq)if(!EQ[k])delete s.eq[k];
  s.contracts=s.contracts.filter(c=>JOBS[c.j]);s.jobs=s.jobs.filter(o=>JOBS[o.j]);s.tenders=s.tenders.filter(t=>JOBS[t.j]&&t.postes);

  s.schema=SCHEMA;return s}

function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=(h+l-7*m+114)%31+1;return new Date(y,mo-1,da)}
const FERIES={};
function ferie(x){const y=x.getFullYear();if(!FERIES[y]){const e=easter(y),add=n=>{const t=new Date(e);t.setDate(t.getDate()+n);return t.getMonth()+'-'+t.getDate()};
  FERIES[y]={'0-1':"Nouvel An",[add(1)]:'Lundi de Pâques','4-1':'Fête du Travail',[add(39)]:'Ascension',[add(50)]:'Lundi de Pentecôte','6-21':'Fête nationale','7-15':'Assomption','10-1':'Toussaint','10-11':'Armistice','11-25':'Noël'}}
  return FERIES[y][x.getMonth()+'-'+x.getDate()]||null}
function conge(x){const m=x.getMonth(),d=x.getDate();return(m===6&&d>=12)||(m===7&&d<=1)} // congés du bâtiment (± 3 semaines en juillet)
function dayKind(d){const x=date(d),wd=x.getDay();if(wd===0||wd===6)return'Week-end';const f=ferie(x);if(f)return f;if(conge(x))return'Congés du bâtiment';return null}
const isWork=d=>!dayKind(d);
function addWork(d,n){let k=d;while(n>0){k++;if(isWork(k))n--}return k}

function clsFor(v,nat){if(nat!=='travaux'||v<=CLS[0].max)return 0;return v<=CLS[1].max?1:2}
function trueUnit(j){// prix de revient réel d'une unité principale (équipe type + machines)
  const J=JOBS[j];const crew=J.minW;const sal=crew*228;let m=0;J.need.forEach(k=>m+=EQ[k].u);return(sal+m+40)/(J.rate*crew)}
function genTender(forceJob,urgent){
  const m=month(),ok=SPWJ.filter(k=>inSeason(JOBS[k],m));const j=forceJob||pick(ok),J=JOBS[j];
  const big=st.cls>=1||st.stats.ca>150000,r=Math.random();
  const proc=urgent?'fm':r<.45?'fm':r<(big?.75:.85)?'pn':'po';
  let V=proc==='fm'?R(6000,29500):proc==='pn'?R(30000,142000):R(143000,big?(st.cls>=1?1200000:450000):300000);
  // invitation : en faible montant et négociée, il faut être invité
  if(proc!=='po'){const pInv=.3+st.rep/140+(has('dirc')?.25:0)+(st.stats.spw>0?.1:0);if(!urgent&&Math.random()>pInv)return}
  const q=Math.max(J.q0,Math.round(V/(trueUnit(j)*1.27)));
  const nRef=Math.max(J.minW,Math.ceil(q/(J.rate*90)));
  const N=Math.ceil(q/(J.rate*nRef)*R(1.25,1.5))+3;
  const B=pick(BUYERS);const postes=[];
  const tu=trueUnit(j);postes.push({d:J.main,u:J.un,q,ref:+(tu*1.27).toFixed(2),c:tu});
  if(J.ex)postes.push({d:J.ex.d,u:J.ex.u,q:Math.max(1,Math.round(q*J.ex.k)),ref:J.ex.pu,c:J.ex.c});
  postes.push({d:'Signalisation de chantier (mise en place, maintien, enlèvement)',u:'jour',q:Math.ceil(N*.8),ref:J.need.includes('fleche')?135:80,c:J.need.includes('fleche')?105:62});
  const est=Math.round(postes.reduce((a,p)=>a+p.q*p.ref*R(.95,1.08),0)/10)*10;
  const crit=proc==='po'&&Math.random()<.4?'pvt':'prix';
  const bidEnd=st.day+(urgent?3:RI(10,20)),dec=bidEnd+(proc==='po'?RI(15,25):RI(5,12));
  st.tenders.push({id:st.nid++,j,q,est,N,nRef,postes,proc,crit,buyer:B[0],ref:`MI/${B[1]}/${date(st.day).getFullYear()}/${String(RI(100,980)).padStart(4,'0')}`,road:pick(B[2]),town:pick(B[3]),
    bidEnd,dec,status:'open',my:null,bids:null,cls:clsFor(est,J.nat),caut:est>50000,urgent:!!urgent,noise:R(-.15,.15)});
}

  for(const r of sh){const busy=r.load.filter(e=>e>st.day).length;const p=t.est*(r.ag+R(-.06,.06)+busy*.02);

// Préavis en semaines selon l'ancienneté (statut unique, licenciement par l'employeur)
function preavisW(w){const m=(st.day-(w.hd||0))/30.4;if(m<3)return 1;if(m<4)return 3;if(m<5)return 4;if(m<6)return 5;if(m<9)return 6;if(m<12)return 7;if(m<15)return 8;if(m<18)return 9;if(m<21)return 10;if(m<24)return 11;return 12+Math.floor(m/12-2)}
const preavisCost=w=>Math.round(preavisW(w)*5*w.day);
const FAUTES=[['passe beaucoup de temps sur son GSM',0],['fait des pauses beaucoup trop longues',0],['arrive en retard le matin',0],["attend qu'on lui dise quoi faire et travaille très lentement",0],['passe son temps dans la camionnette',0],
  ['ne porte pas ses EPI (gilet, casque) au bord de la route malgré les consignes',1],["a été vu en train de boire de l'alcool sur le chantier",1],['a quitté le chantier sans prévenir',1]];
// Le contremaître, le patron ou un gestionnaire de chantier remarque qui travaille mal
function observe(c,crew){const chef=crew.find(w=>w.r==='chef'),boss=crew.find(w=>w.boss);const g=st.workers.filter(w=>w.r==='gest');
  for(const w of crew){if(w.boss||w.r==='chef'&&w===chef)continue;
    let who=null;if(chef&&Math.random()<.18)who=chef;else if(boss&&Math.random()<.14)who=boss;else if(g.length&&Math.random()<.06*g.length)who=pick(g);
    if(!who)continue;w.seen=w.mot;
    if(st.reports.some(r=>r.wid===w.id&&!r.done&&st.day-r.day<15))continue;
    if(w.mot<.66){const grave=Math.random()<.18;const f=pick(FAUTES.filter(x=>x[1]===(grave?1:0)));
      st.reports.unshift({id:st.nid++,wid:w.id,cid:c.id,day:st.day,by:who.boss?'Toi':who.n.split(' ')[0],role:who.boss?'patron':ROLES[who.r].n.toLowerCase(),txt:f[0],grave:f[1],road:c.road,done:0});
      log(`📋 Rapport de ${who.boss?'chantier':who.n.split(' ')[0]} : ${w.n.split(' ')[0]} ${f[0]}.`)}
    else if(w.mot>.92&&w.sk>1.15&&Math.random()<.08&&!st.reports.some(r=>r.wid===w.id&&r.good&&st.day-r.day<60)){
      st.reports.unshift({id:st.nid++,wid:w.id,cid:c.id,day:st.day,by:who.boss?'Toi':who.n.split(' ')[0],role:who.boss?'patron':ROLES[who.r].n.toLowerCase(),txt:'fait un excellent travail et motive toute l’équipe',good:1,road:c.road,done:0});log(`🌟 ${w.n.split(' ')[0]} fait du super boulot sur ${esc(c.road)}.`)}
  }
  if(st.reports.length>40)st.reports.length=40}
function rptAct(id,a){const r=st.reports.find(x=>x.id===id);if(!r)return;const w=st.workers.find(x=>x.id===r.wid);if(!w){r.done='parti';render();return}const fn=w.n.split(' ')[0];click();
  if(a==='talk'){w.mot=Math.min(1,w.mot+.12);r.done='Recadré oralement';log(`🗣️ Tu as recadré ${fn}.`,false)}
  else if(a==='warn'){w.warn++;w.mot=Math.min(1,w.mot+.3);if(w.warn>=2&&Math.random()<.5)w.base=Math.min(1,w.base+.15);r.done=`Avertissement écrit n°${w.warn}`;log(`⚠️ Avertissement écrit n°${w.warn} envoyé à ${w.n} (recommandé).`)}
  else if(a==='prime'){if(st.cash<250)return toastMsg('Il faut 250 €.');st.cash-=250;w.mot=1;w.base=Math.min(1,w.base+.05);r.done='Prime de 250 € accordée';log(`🎁 Prime de 250 € pour ${w.n}. Toute l'équipe est motivée !`);st.workers.forEach(x=>{if(x!==w&&ROLES[x.r].cat==='ouv')x.mot=Math.min(1,x.mot+.03)})}
  else if(a==='fire'){if(st.contracts.some(c=>c.st==='run'&&c.crew.includes(w.id)&&c.crew.length<=JOBS[c.j].minW))return toastMsg('Il manquerait du monde sur le chantier : ajoute quelqu’un d’abord.');
    const p=preavisCost(w);if(!confirm(`Licencier ${w.n} avec préavis ?\nAncienneté : ${Math.round((st.day-w.hd)/30.4)} mois → ${preavisW(w)} semaine(s) de préavis payées : ${eur(p)}`))return;
    st.cash-=p;dropW(w);r.done='Licencié avec préavis';log(`📤 ${w.n} est licencié (indemnité de préavis ${eur(p)}).`)}
  else if(a==='grave'){const wd=workDaysSince(r.day);const ok=(r.grave||w.warn>=2)&&wd<=3;
    if(!confirm(`Licencier ${w.n} pour motif grave, sans préavis ?\n${ok?'Le dossier est solide.':'⚠️ Attention : le dossier est faible ('+(wd>3?'plus de 3 jours ouvrables depuis les faits':'pas de faute grave ni 2 avertissements')+'). Il risque d’aller au tribunal du travail.'}`))return;
    dropW(w);if(ok){r.done='Licencié pour motif grave';log(`🚪 ${w.n} est licencié pour motif grave.`)}
    else{const p=preavisCost(w)+Math.round(w.day*5*3*R(1,4));st.cash-=p;st.rep=clamp(st.rep-3,0,100);r.done='Tribunal du travail : condamné';log(`⚖️ ${w.n} conteste au tribunal du travail : tu es condamné à payer ${eur(p)} (préavis + licenciement déraisonnable). Réputation -3.`)}}
  else{r.done=r.good?'Félicité':'Classé sans suite';if(r.good)w.mot=Math.min(1,w.mot+.05)}
  st.workers.forEach(x=>{if(x!==w&&ROLES[x.r].cat==='ouv'&&(a==='warn'||a==='fire'||a==='grave'))x.mot=Math.min(1,x.mot+.02)});
  save();render()}
function dropW(w){st.contracts.forEach(c=>{c.crew=c.crew.filter(i=>i!==w.id)});st.workers.splice(st.workers.indexOf(w),1)}
function workDaysSince(d){let n=0;for(let k=d+1;k<=st.day;k++)if(isWork(k))n++;return n}
const behav=w=>w.boss||w.seen===undefined?null:w.seen<.55?['🔴 À surveiller','r']:w.seen<.72?['🟠 Moyen','o']:['🟢 Sérieux','g'];
function refreshCand(){const n=has('rh')?7:4;st.cand=[];for(let i=0;i<n;i++){const r=Math.random();st.cand.push(mkW(r<.25?'etu':r<.6?'man':r<.8?'qual':r<.92?'chauf':'chef'))}}
const GOALS=[
  {k:'g0',t:"Inscris ton entreprise à la BCE (📊 Entreprise)",ok:()=>!!st.adm.bce},
  {k:'g1',t:'Termine ton premier petit boulot',ok:()=>st.stats.done>=1},
  {k:'g2',t:'Achète ta première machine (🚜 Matériel)',ok:()=>Object.values(st.eq).some(n=>n>0)},
  {k:'g3',t:'Embauche ton premier ouvrier (👷 Équipe)',ok:()=>field().length>=2},
  {k:'g4',t:'Achète une camionnette',ok:()=>st.eq.van>0},
  {k:'g5',t:"Assurance RC + certification VCA",ok:()=>st.adm.rc&&st.adm.vca},
  {k:'g6',t:'Remets ta première offre à un marché public',ok:()=>st.tenders.some(t=>t.my)||st.stats.won+st.stats.lost>0},
  {k:'g7',t:'Gagne ton premier marché public',ok:()=>st.stats.won>=1},
  {k:'g8',t:'Engage Angélique, ton aide-comptable',ok:()=>has('aide')},
  {k:'g9',t:'Engage un gestionnaire de chantier',ok:()=>has('gest')},
  {k:'g10',t:'Achète une grosse machine (tracteur, balayeuse, hydrocureuse)',ok:()=>['tracteur','balayeuse','hydro'].some(k=>st.eq[k]>0)},
  {k:'g11',t:"Obtiens l'agréation classe 1",ok:()=>st.cls>=1},
  {k:'g12',t:'Monte une équipe de 15 personnes',ok:()=>ownW()>=15},
  {k:'g13',t:'Engage un directeur',ok:()=>has('dirt')||has('daf')||has('dirc')},
  {k:'g14',t:"Atteins 1 million € de chiffre d'affaires",ok:()=>st.stats.ca>=1e6},
  {k:'g15',t:'Agréation classe 2 : tu es une grande entreprise !',ok:()=>st.cls>=2}];
function goals(){for(const g of GOALS)if(!st.goals[g.k]&&g.ok()){st.goals[g.k]=1;log('🏆 Objectif atteint : '+g.t);snd(660,.1,'triangle',.06);snd(990,.25,'triangle',.06,.1)}}
const curGoal=()=>GOALS.find(g=>!st.goals[g.k]);

/* ---------- Chantiers ---------- */
let pickSel=[];
function startUI(id){const c=st.contracts.find(x=>x.id===id);if(!c)return;const J=JOBS[c.j];
  const fw=freeW(c).sort((a,b)=>(J.pc?b.pc-a.pc:0)||b.sk-a.sk);
  pickSel=c.st==='run'?c.crew.filter(i=>fw.some(w=>w.id===i)):fw.slice(0,Math.max(J.minW,c.nRef)).map(w=>w.id);
  startDraw(id)}
function startDraw(id){const c=st.contracts.find(x=>x.id===id),J=JOBS[c.j];const fw=freeW(c).sort((a,b)=>b.sk-a.sk);
  const sel=fw.filter(w=>pickSel.includes(w.id));const n=sel.length,p=eqPlan(c.j,c);const pw=sel.reduce((a,w)=>a+w.sk,0)*(sel.some(w=>w.r==='chef')?1.15:1);
  const days=pw?Math.ceil((c.q-c.prog)/(J.rate*pw)):'∞';const left=c.N-c.wd;const pcOk=!J.pc||hasPC(sel);
  const cost=sel.reduce((a,w)=>a+w.day,0)+p.day;
  showModal(`<h3>${c.st==='run'?"Modifier l'équipe":'Préparer le chantier'}</h3><div class="hd"><div class="ic" style="--ac2:${J.ac}33">${J.ic}</div><div><b>${J.n}</b><div class="mut">${esc(c.road)} — ${c.town}</div></div></div>
  <div class="tags"><span class="tag">Reste ${nb(c.q-c.prog)} ${J.un}</span><span class="tag ${left<0?'r':''}">Délai : ${left} jours ouvrables</span><span class="tag g">${eur(c.price)}</span></div>
  <h2>Équipe (minimum ${J.minW}${J.pc?', dont un permis C':''})</h2><div>${fw.map(w=>`<span class="chip ${pickSel.includes(w.id)?'on':''}" onclick="togW(${c.id},${w.id})">${ROLES[w.r].ic} ${esc(w.n.split(' ')[0])} ${'●'.repeat(Math.round(w.sk*3))}${w.pc?' 🪪':''}</span>`).join('')||'<span class="mut">Tout le monde est déjà sur un chantier.</span>'}</div>
  ${J.need.length?`<h2>Matériel</h2>${J.need.map(t=>`<div class="row" style="margin:3px 0">${EQ[t].ic} ${EQ[t].n} ${p.own[t]?'<span class="tag g">OK</span>':'<span class="tag r">pris sur un autre chantier</span>'}</div>`).join('')}`:'<p class="mut">Pas de machine : pince, gants et sacs suffisent.</p>'}
  <div class="card" style="margin:12px 0"><div>Durée prévue : <b>${days} jours ouvrables</b> ${days!=='∞'&&days>left?'<span class="tag r">trop lent !</span>':'<span class="tag g">OK</span>'}</div><div class="mut sm">Coût par jour : ${eur(cost)} (salaires + carburant)</div>${sel.some(w=>w.r==='chef')?'<div class="mut sm">🦺 Contremaître présent : +15 %</div>':''}${!pcOk?'<div class="neg">Il faut un permis C dans l’équipe.</div>':''}${running().length>=mgmtCap()&&c.st!=='run'?`<div class="neg sm">Encadrement saturé (${running().length}/${mgmtCap()} chantiers) : les équipes iront moins vite.</div>`:''}</div>
  <div class="row"><button class="btn" ${n<J.minW||p.miss.length||!pcOk?'disabled':''} onclick="startGo(${c.id})">C'est parti !</button><button class="btn s" onclick="closeM()">${c.st==='run'?'Annuler':'Plus tard'}</button></div>`)}
function togW(cid,wid){click();const i=pickSel.indexOf(wid);i<0?pickSel.push(wid):pickSel.splice(i,1);startDraw(cid)}
function startGo(id){const c=st.contracts.find(x=>x.id===id);const p=eqPlan(c.j,c);if(p.miss.length)return;c.own=p.own;c.crew=[...pickSel];
  if(c.st!=='run'){c.st='run';log(`🦺 Chantier lancé : ${JOBS[c.j].n} (${esc(c.road)})`,false)}st.sel=c.id;closeM();snd(440,.08,'square',.04);snd(660,.12,'square',.04,.08);save();tab('ch')}

/* ---------- Personnel, achats, banque ---------- */
function hire(i){const w=st.cand[i];if(!w)return;if(!st.adm.bce)return toastMsg("Inscris d'abord ton entreprise à la BCE.");if(st.cash<monthly(w))return toastMsg(`Il faut pouvoir payer un mois de salaire (${eur(monthly(w))}).`);
  st.cand.splice(i,1);w.mot=w.base;w.hd=st.day;st.workers.push(w);log(`👷 ${w.n} rejoint l'équipe : ${ROLES[w.r].n}.`,false);kaching();goals();save();render()}
function hireRole(r){const R0=ROLES[r];if(!st.adm.bce)return;if(!R0.multi&&has(r))return;if(R0.need&&ownW()<R0.need)return toastMsg(`Il faut au moins ${R0.need} personnes dans l'entreprise.`);
  const day=R0.day;if(st.cash<day*WDM)return toastMsg(`Il faut pouvoir payer un mois de salaire (${eur(day*WDM)}).`);
  const n=R0.who||GESTN.find(x=>!st.workers.some(w=>w.n===x))||pick(PREN)+' '+pick(NOMS);
  st.workers.push({id:st.nid++,n,r,sk:1,day,pc:0,skin:RI(0,SKIN.length-1),base:1,mot:1,hd:st.day,warn:0});log(`${R0.ic} ${n} rejoint ${esc(st.name)} : ${R0.n}.`);kaching();goals();save();render()}
function fire(id){const w=st.workers.find(x=>x.id===id);if(!w||w.boss)return;if(st.contracts.some(c=>c.st==='run'&&c.crew.includes(id)))return toastMsg("Cette personne est sur un chantier : retire-la d'abord.");
  const pre=preavisCost(w);if(!confirm(`Licencier ${w.n} ?\nAncienneté : ${Math.round((st.day-(w.hd||0))/30.4)} mois → ${preavisW(w)} semaine(s) de préavis payées : ${eur(pre)}`))return;st.cash-=pre;dropW(w);log(`📤 ${w.n} est licencié (préavis ${eur(pre)}).`,false);save();render()}
function trainPC(id){const w=st.workers.find(x=>x.id===id);if(!w||w.pc)return;if(st.cash<2900)return toastMsg('Il faut 2 900 € pour le permis C (auto-école + examen + CAP).');st.cash-=2900;w.pc=1;log(`🪪 ${w.n} a obtenu son permis C !`);save();render()}
function buy(t){const e=EQ[t];if(st.cash<e.p)return toastMsg(`Pas assez d'argent : il manque ${eur(e.p-st.cash)}.`);st.cash-=e.p;st.eq[t]=(st.eq[t]||0)+1;log(`🛒 Achat : ${e.ic} ${e.n}`,false);kaching();goals();save();render()}
function sell(t){if(freeEq(t)<1)return toastMsg('Ce matériel est utilisé sur un chantier.');const v=Math.round(EQ[t].p*.55);if(!confirm(`Revendre ${EQ[t].n} pour ${eur(v)} ?`))return;st.eq[t]--;st.cash+=v;log(`💰 Revente : ${EQ[t].n} +${eur(v)}`,false);save();render()}
function buyAdm(k){const a=ADM[k];if(st.adm[k])return;if(k!=='bce'&&!st.adm.bce)return toastMsg("Inscris d'abord ton entreprise à la BCE.");if(st.cash<a.p)return toastMsg(`Il manque ${eur(a.p-st.cash)}.`);st.cash-=a.p;st.adm[k]=1;log(`${a.ic} ${a.n} : c'est fait !`);kaching();goals();save();render()}
function clsOk(u){return!!(st.adm.vca&&st.adm.rc)&&st.stats.ca>=u.ca&&ownW()>=u.w&&st.rep>=u.r&&st.cash>=u.c&&(!u.dir||u.dir.every(has))}
function upCls(){const u=CLS[st.cls+1];if(!u||!clsOk(u))return;st.cash-=u.c;st.cls++;log(`🏅 Agréation ${u.n} (catégorie G — routes) : marchés de travaux jusqu'à ${eur(u.max)} !`);kaching();goals();save();render()}
const loanMax=()=>st.adm.bce?Math.round((10000+st.stats.ca*.3)*(has('compta')?1.5:1)*(has('daf')?2:1)/5000)*5000:0;
function loan(k){if(k>0){if(st.loan+5000>loanMax())return toastMsg(st.adm.bce?"La banque refuse : montant maximum atteint. Fais plus de chiffre d'affaires.":"La banque ne prête qu'aux entreprises inscrites à la BCE.");st.loan+=5000;st.cash+=5000;kaching()}else{if(st.loan<=0||st.cash<5000)return;st.loan-=5000;st.cash-=5000}save();render()}
function rename(){showModal(`<h3>Nom de ta société</h3><input type="text" id="nm" value="${esc(st.name)}" maxlength="28"><p></p><button class="btn w" onclick="setName()">Enregistrer</button>`)}
function setName(){const v=$('#nm').value.trim().replace(/[<>&"]/g,'');if(v)st.name=v;closeM();save();render()}

function exportSave(){const code=btoa(unescape(encodeURIComponent(JSON.stringify(st))));showModal(`<h3>💾 Code de sauvegarde</h3><p class="mut">Garde ce code (dans tes notes ou par message) pour retrouver ta partie sur un autre GSM.</p><textarea id="sv" rows="5" readonly>${code}</textarea><p></p><div class="row"><button class="btn" onclick="copySave()">Copier</button><button class="btn s" onclick="closeM()">Fermer</button></div>`)}

function importUI(){showModal(`<h3>📥 Charger une sauvegarde</h3><p class="mut">Colle ici ton code de sauvegarde. Ta partie actuelle sera remplacée.</p><textarea id="sv" rows="5"></textarea><p></p><div class="row"><button class="btn" onclick="importGo()">Charger</button><button class="btn s" onclick="closeM()">Annuler</button></div>`)}
function importGo(){try{const s=JSON.parse(decodeURIComponent(escape(atob($('#sv').value.trim()))));if(!s.workers)throw 0;st=migrate(s);save();closeM();render();toastMsg('Sauvegarde chargée ✓')}catch(e){toastMsg('Code invalide')}}

function goalCard(){const g=curGoal();return g?`<div class="goal"><span class="gi">🎯</span><div><b>Objectif</b><div>${g.t}</div></div></div>`:''}
function jobHead(J,sub,right){return`<div class="hd"><div class="ic" style="--ac2:${J.ac}2e">${J.ic}</div><div style="flex:1;min-width:0"><h3>${J.n}</h3><div class="mut">${sub}</div></div>${right||''}</div>`}

    for(let k=0;k<Math.min(5,ownW());k++)worker(bx+222-k*17,CH*.99-(k%2)*3,t*.3,{tool:'',ph:k,skin:st.workers[k].skin,helm:k===0?'#fff':k%2?'#ffd23f':'#ff9a1f'});
  }
  // touffes au premier plan
  for(let i=Math.floor(camX*1.15/40)-1;i<Math.floor((camX*1.15+CW)/40)+2;i++){const x=i*40-camX*1.15;if(hh(i*41)<.5){const h=6+hh(i*43)*6;for(let k=0;k<4;k++)ln(x+k*3,CH,x+k*3+Math.sin(t*2+i)*1.5-2+k,CH-h,pal.grass2,1.5)}}
  // particules
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.gr||160)*dt;p.l-=dt;if(p.txt){g.globalAlpha=Math.min(1,p.l*2);g.fillStyle='#ffe066';g.font='900 15px Nunito,sans-serif';g.strokeStyle='rgba(0,0,0,.5)';g.lineWidth=3;g.strokeText(p.txt,p.x-camX,p.y);g.fillText(p.txt,p.x-camX,p.y);g.globalAlpha=1}else circ(p.x-camX,p.y,p.r,p.c)}
  parts=parts.filter(p=>p.l>0);if(parts.length>260)parts.splice(0,parts.length-260);
  // météo
  if(wk==='rain'||wk==='storm'){g.strokeStyle='rgba(210,225,240,.55)';g.lineWidth=1;g.beginPath();for(let k=0;k<70;k++){const x=(hh(k*3)*CW+t*60+k*7)%CW,y=(hh(k*7)*CH+t*520)%CH;g.moveTo(x,y);g.lineTo(x-3,y+10)}g.stroke()}
  if(wk==='storm'){if(Math.random()<.004)flash=1;if(flash>0){g.fillStyle=`rgba(255,255,255,${flash*.6})`;g.fillRect(0,0,CW,CH);flash-=dt*3}}
  if(wk==='snow'){for(let k=0;k<60;k++){const x=(hh(k*3)*CW+Math.sin(t+k)*12+t*10)%CW,y=(hh(k*7)*CH+t*40)%CH;circ(x,y,1.2+hh(k)*1.4,'rgba(255,255,255,.9)')}}
  // vignette
  const vg=g.createLinearGradient(0,CH-30,0,CH);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.25)');g.fillStyle=vg;g.fillRect(0,CH-30,CW,30);
  lastT=t;
  // HUD
  const hj=$('#hudJob'),pb=$('#prog');
  if(c){const txt=`${J.ic} ${J.p?c.road:c.road+' · '+c.town}`;if(hj.textContent!==txt)hj.textContent=txt;pb.style.display='block';pb.firstChild.style.width=(c.prog/c.q*100)+'%'}
  else{const txt=st.adm.bce?'🏠 Au dépôt — pas de chantier':'🏠 À la maison';if(hj.textContent!==txt)hj.textContent=txt;pb.style.display='none'}
}
const pick3=(i,a)=>a[Math.abs(i)%a.length];
cv.addEventListener('pointerdown',e=>{const c=selC();if(!c)return;const b=cv.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;
  if(y<CH*.62)return;const wx=x+camX,tx=c.vis/c.q*LEN+220;
  if(wx<tx-10||wx>tx+CW*.45)return;const i=Math.floor(wx/SEG);if(c.tap[i])return;c.tap[i]=1;const J=JOBS[c.j];c.prog=Math.min(c.q,c.prog+c.q*(J.p?0.012:0.0015));
  parts.push({x:wx,y:y-6,vx:0,vy:-50,l:1,gr:30,txt:'+1 👍'});for(let k=0;k<8;k++)parts.push({x:wx,y,vx:R(-70,70),vy:R(-110,-30),l:.6,c:pick(['#ffd23f','#ff9a1f','#fff']),r:2});snd(900+Math.random()*300,.05,'triangle',.04)});

/* ---------- Boucle ---------- */
const SPD=[0,3000,1200,400];let acc=0,prevT=performance.now();
function loop(now){const dt=Math.min(250,now-prevT);prevT=now;if(playing&&!modalOpen&&speed&&!st.over){acc+=dt;if(acc>=SPD[speed]){acc=0;tick()}}draw(now/1000);requestAnimationFrame(loop)}
render();
$('#play').onclick=()=>{playing=true;$('#splash').style.display='none';$('#ins').classList.remove('on');click();
  if(!st.started){st.started=true;save();showModal(`<h3>🦺 Bienvenue dans Route Nette</h3><p>Tu pars de <b>zéro</b> : ${eur(st.cash)} sur ton compte, ta vieille voiture, une pince, des gants et des sacs.</p>
  <div class="card"><div style="margin:4px 0">1️⃣ <b>Inscris-toi à la BCE</b> pour pouvoir facturer.</div><div style="margin:4px 0">2️⃣ Fais des <b>petits boulots</b> (déchets, pelouses, haies…) et économise.</div><div style="margin:4px 0">3️⃣ Achète tes <b>machines</b>, engage des <b>ouvriers</b>.</div><div style="margin:4px 0">4️⃣ RC, VCA, camionnette : remets offre aux <b>marchés publics du SPW</b>, face aux autres entreprises.</div><div style="margin:4px 0">5️⃣ Engage Angélique (aide-comptable), des gestionnaires de chantier, des directeurs… et décroche l'agréation 🏆</div></div>
  <p class="mut">Prix HTVA, salaires et règles des marchés publics comme en Belgique. Nom de ta société :</p><input type="text" id="nm" value="${esc(st.name)}" maxlength="28"><p></p><button class="btn w" onclick="setName()">C'est parti !</button>`)}};
requestAnimationFrame(loop);
</script>
<script>
// Version du jeu : à changer à chaque mise à jour, avec la même valeur dans version.json.
var APPV="2026-11-03.2";
var SWR=null,BIP=null;
var say=function(t){try{toastMsg(t)}catch(x){}};
if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js?v='+APPV).then(function(r){SWR=r}).catch(function(){})});
(function(){var v=document.getElementById("ver");if(v)v.textContent="Version "+APPV})();
function chkV(man){if(!window.fetch)return;if(SWR)SWR.update().catch(function(){});
 fetch("version.json?"+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(j){
  if(!j||!j.v||j.v===APPV){if(man)say("Le jeu est à jour ✓ (version "+APPV+")");return}
  try{save()}catch(x){}
  document.getElementById("updn").textContent=(j.notes||"")+" Ta progression est conservée.";document.getElementById("ins").classList.remove("on");document.getElementById("upd").classList.add("on")}).catch(function(){if(man)say("Pas de connexion internet")})}
(function(){try{var o=localStorage.getItem("routenette-v");localStorage.setItem("routenette-v",APPV);if(o&&o!==APPV)setTimeout(function(){say("Jeu mis à jour ✓ Ta progression est intacte.")},800)}catch(x){}})();
chkV();setInterval(chkV,30*60000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)chkV()});
function standalone(){try{return matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: fullscreen)").matches||navigator.standalone===true}catch(x){return false}}
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1)}
function inApp(){return /; wv\)|FBAN|FBAV|FB_IAB|Messenger|Instagram|WhatsApp|Snapchat|musical_ly|TikTok|Line\/|GSA\//.test(navigator.userAgent)}
function isAndroid(){return /Android/i.test(navigator.userAgent)}
function isChrome(){var u=navigator.userAgent;return !inApp()&& /Chrome\//.test(u)&&!/EdgA?\/|OPR\/|SamsungBrowser|HuaweiBrowser|HeyTapBrowser|MiuiBrowser|YaBrowser|Firefox|FxiOS|CriOS/.test(u)}
function showIns(force){if(standalone()||document.getElementById("upd").classList.contains("on"))return;
 if(!force){try{if(Date.now()-(+localStorage.getItem("routenette-ins")||0)<3*864e5)return}catch(x){}}
 var m=document.getElementById("insm"),b=document.getElementById("insb");
 if(BIP){m.textContent="Ajoute le jeu sur ton écran d’accueil, en un appui.";b.textContent="Installer";b.style.display=""}
 else if(isAndroid()){m.textContent=isChrome()?"Menu ⋮ → « Installer l’application ». Pas dans le menu ? Ouvre d’abord dans Chrome.":"Ce navigateur ne peut pas installer le jeu : ouvre-le dans Chrome.";b.textContent="Ouvrir dans Chrome";b.style.display=""}
 else if(inApp()){m.textContent="Tu es dans le navigateur d’une messagerie : ouvre le jeu dans Safari pour l’installer.";b.textContent="Copier le lien";b.style.display=""}
 else if(isIOS()){m.textContent="Dans Safari : touche Partager ⬆️ puis « Sur l’écran d’accueil ».";b.style.display="none"}
 else{m.textContent="Ce navigateur ne peut pas l’installer : copie le lien et ouvre-le dans Chrome.";b.textContent="Copier le lien";b.style.display=""}
 document.getElementById("ins").classList.add("on")}
function insLater(){try{localStorage.setItem("routenette-ins",Date.now())}catch(x){}document.getElementById("ins").classList.remove("on")}
function doIns(){if(BIP){var e=BIP;BIP=null;e.prompt();e.userChoice.then(function(c){if(c&&c.outcome==="accepted")document.getElementById("ins").classList.remove("on");else insLater()}).catch(function(){});return}
 var u=location.href.split("#")[0];
 if(isAndroid()){location.href="intent://"+u.replace(/^https?:\/\//,"")+"#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url="+encodeURIComponent(u)+";end";return}
 (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){say("Lien copié ✓ Colle-le dans Chrome")}).catch(function(){prompt("Copie ce lien et ouvre-le dans Chrome :",u)})}
addEventListener("beforeinstallprompt",function(e){BIP=e;if(document.getElementById("splash").style.display!=="none")showIns()});
addEventListener("appinstalled",function(){BIP=null;document.getElementById("ins").classList.remove("on");say("Jeu installé ✓")});
(function(){var p=document.getElementById("insp");if(p&&!standalone())p.style.display=""})();
setTimeout(function(){if(BIP||standalone()||document.getElementById("splash").style.display==="none")return;showIns()},3500);
</script>
