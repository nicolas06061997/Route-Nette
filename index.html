<title>Route Nette</title>
<style>
:root{
  --bg:#0d1a14;--bg2:#12241b;--card:#18301f;--card2:#1f3b29;--line:#2c4d37;--tx:#f2f7f3;--mut:#a3bcaa;
  --or:#ff9a1f;--or2:#ffb84d;--gr:#4fdc7a;--gr2:#2fb35a;--rd:#ff5d57;--bl:#4fb3ff;--ye:#ffd23f;--vi:#b48cff;
  --sh:0 6px 20px rgba(0,0,0,.35);--r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:600 15px/1.35 Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;max-width:760px;margin:auto;background:linear-gradient(180deg,#0d1a14,#0a140f)}
button{font-family:inherit}
/* --- En-tête --- */
#top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:linear-gradient(180deg,#14281d,#0f2017);border-bottom:1px solid var(--line)}
#logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--or),#ff6a00);display:grid;place-items:center;font-weight:900;color:#2a1600;font-size:15px;box-shadow:0 3px 10px rgba(255,140,0,.35);flex:none}
#tinfo{flex:1;min-width:0}
#tname{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tsub{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cash{background:linear-gradient(135deg,#1f4d2e,#16371f);border:1px solid #2f7a45;border-radius:12px;padding:5px 10px;font-weight:900;font-size:17px;color:#b9ffd0;white-space:nowrap}
#cash.neg{background:linear-gradient(135deg,#5a1f1d,#3b1412);border-color:#9b3a35;color:#ffc2bd}
/* --- Barre de scène --- */
#scene{position:relative}
#cv{width:100%;height:230px;display:block;touch-action:manipulation;background:#7fb8e8}
#hud{position:absolute;left:8px;right:150px;top:8px;flex-direction:column;align-items:flex-start;display:flex;gap:6px;align-items:center;pointer-events:none}
.pill{background:rgba(8,18,13,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:800;white-space:nowrap}
#hudJob{max-width:100%;overflow:hidden;text-overflow:ellipsis}
#speed{position:absolute;right:8px;top:8px;display:flex;gap:4px;background:rgba(8,18,13,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:12px;padding:3px;border:1px solid rgba(255,255,255,.12)}
#speed button{background:none;border:0;color:#fff;font-size:12px;font-weight:900;padding:5px 7px;border-radius:9px;letter-spacing:-2px}
#speed button.on{background:var(--or);color:#2a1600}
#prog{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.4);overflow:hidden;display:none}
#prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gr2),var(--gr));box-shadow:0 0 8px var(--gr)}
/* --- Contenu --- */
#pane{flex:1;overflow-y:auto;padding:12px 12px 24px;-webkit-overflow-scrolling:touch}
.card{background:linear-gradient(180deg,var(--card),#152a1c);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;box-shadow:var(--sh);position:relative;overflow:hidden}
.card.acc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ac,var(--or))}
.card h3{margin:0;font-size:16.5px;font-weight:900;line-height:1.2}
.hd{display:flex;gap:10px;align-items:center}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none;background:var(--ac2,#2b4a35)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px;font-weight:600}
.sm{font-size:12.5px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:4px;background:#24402e;border-radius:8px;padding:3px 8px;font-size:12.5px;font-weight:800}
.tag.g{background:#1d5232;color:#b6f7c9}.tag.r{background:#5b2322;color:#ffc0bb}.tag.o{background:#5c3a0e;color:#ffd79a}.tag.b{background:#173f5e;color:#bfe3ff}.tag.v{background:#3d2c66;color:#dccbff}
.btn{appearance:none;border:0;border-radius:12px;padding:10px 16px;font-weight:900;font-size:15px;color:#2a1600;background:linear-gradient(180deg,var(--or2),var(--or));box-shadow:0 3px 0 #b8630a,0 6px 14px rgba(255,140,0,.25);cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b8630a}
.btn.s{background:linear-gradient(180deg,#2f5139,#264430);color:var(--tx);box-shadow:0 3px 0 #18301f}
.btn.g{background:linear-gradient(180deg,#6cf094,var(--gr2));color:#06230f;box-shadow:0 3px 0 #1d7a3c}
.btn.r{background:linear-gradient(180deg,#ff7f79,var(--rd));color:#fff;box-shadow:0 3px 0 #a3302b}
.btn.w{width:100%}
.btn:disabled{opacity:.42;filter:saturate(.4);box-shadow:none}
.bar{height:10px;background:#0b170f;border-radius:6px;overflow:hidden;margin:8px 0 4px;border:1px solid #23402d}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gr2),var(--gr));border-radius:6px}
.money{color:var(--gr);font-weight:900}.neg{color:var(--rd);font-weight:900}
h2{font-size:12.5px;color:var(--mut);margin:16px 4px 8px;text-transform:uppercase;letter-spacing:.08em;font-weight:900}
.req{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:12.5px}
.goal{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,#3b2a0a,#2a1f0b);border:1px solid #7a5418;border-radius:var(--r);padding:10px 12px;margin-bottom:12px}
.goal b{color:var(--ye)}
.goal .gi{font-size:26px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi div{background:#132619;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.kpi b{display:block;font-size:17px;font-weight:900}
.kpi span{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:6px 2px;border-bottom:1px solid var(--line)}td:last-child{text-align:right;font-weight:800}
/* --- Onglets --- */
nav{display:flex;background:#0b1711;border-top:1px solid var(--line);padding:4px 4px calc(env(safe-area-inset-bottom) + 4px)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:5px 0 4px;font-size:10.5px;font-weight:800;position:relative;min-width:0;border-radius:12px}
nav button b{display:block;font-size:21px;line-height:1.15;filter:grayscale(.5);opacity:.85}
nav button.on{color:var(--or2);background:#1a3022}
nav button.on b{filter:none;opacity:1;transform:scale(1.08)}
nav .bd{position:absolute;top:1px;right:calc(50% - 22px);background:var(--rd);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;font-weight:900;min-width:16px}
/* --- Fenêtres --- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:40;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#modal.on{display:flex}
#modal .box{background:linear-gradient(180deg,#1c3626,#132619);width:100%;max-width:760px;max-height:90dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);border-top:3px solid var(--or);animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
#modal h3{margin:0 0 10px;font-size:20px;font-weight:900}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#203a29;border-radius:20px;padding:7px 11px;margin:3px;font-size:14px;font-weight:800}
.chip.on{background:var(--gr);color:#06230f;border-color:var(--gr)}
input[type=range]{width:100%;accent-color:var(--or);height:28px}
input[type=text],textarea{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:#0b170f;color:var(--tx);font:700 16px Nunito,system-ui,sans-serif}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 78px);transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px;width:94%;max-width:520px;pointer-events:none}
#toast div{background:rgba(14,30,21,.96);border:1px solid var(--or);border-radius:14px;padding:9px 13px;animation:tin .3s;box-shadow:var(--sh);font-size:14px}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.log div{padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.big{font-size:28px;font-weight:900}
/* --- Accueil --- */
#splash{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;
  background:radial-gradient(120% 80% at 50% 0%,#2f7a45 0%,#163a24 45%,#0b1711 100%)}
#splash h1{margin:0;font-size:46px;font-weight:900;letter-spacing:-.02em;line-height:1;background:linear-gradient(180deg,#fff,#ffd79a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 6px 30px rgba(255,160,40,.25)}
#splash p{margin:0;color:#cfe6d6;font-size:15px;max-width:340px}
#splash .btn{min-width:230px;font-size:18px;padding:14px 20px}
#splash .ver{font-size:12px;color:var(--mut);margin-top:6px}
/* --- Installation et mises à jour --- */
#upd,#ins{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:60;display:none;align-items:center;gap:10px;background:#1c3626;border:1px solid var(--or);color:var(--tx);border-radius:16px;padding:10px 12px;box-shadow:var(--sh);max-width:736px;margin:auto}
#upd.on,#ins.on{display:flex}#upd>div,#ins>div{flex:1}#upd small,#ins small{display:block;font-weight:600;opacity:.85;font-size:13px}
#ins .x{background:transparent;color:var(--tx);border:0;font-size:18px;padding:8px}
</style>
</head>

<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const eur=n=>(n<0?'-':'')+Math.round(Math.abs(n)).toLocaleString('fr-BE')+' €';
const nb=n=>Math.round(n).toLocaleString('fr-BE');
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

/* =====================================================================
   DONNÉES — prix HTVA proches de la réalité en Belgique
   ===================================================================== */
// Matériel : p = prix d'achat, u = carburant + entretien par jour de chantier, veh = véhicule assuré (light/heavy)
const EQ={
  souffleur:{n:'Souffleur à dos',ic:'🍃',p:480,u:4},
  taillehaie:{n:'Taille-haie thermique',ic:'✂️',p:650,u:4},
  tondeuse:{n:'Tondeuse pro tractée',ic:'🌱',p:950,u:6},
  debrou:{n:'Débroussailleuse pro',ic:'🪚',p:1100,u:7},
  remorque:{n:'Remorque 750 kg',ic:'🛒',p:1300,u:3},
  signal:{n:'Kit de signalisation (cônes, panneaux)',ic:'🚧',p:1600,u:2},
  karcher:{n:'Nettoyeur haute pression thermique',ic:'💦',p:2200,u:12},
  fleche:{n:'Remorque flèche lumineuse',ic:'⚠️',p:11500,u:8,veh:'l'},
  van:{n:'Camionnette plateau (occasion)',ic:'🚐',p:16500,u:32,veh:'l'},
  broyeur:{n:'Broyeur de branches',ic:'🪵',p:19000,u:35},
  nacelle:{n:'Camion nacelle 20 m (occasion)',ic:'🏗️',p:87000,u:90,veh:'h'},
  tracteur:{n:'Tracteur + épareuse (occasion)',ic:'🚜',p:89000,u:120,veh:'h'},
  balayeuse:{n:'Balayeuse de voirie (occasion)',ic:'🧹',p:98000,u:110,veh:'h'},
  hydro:{n:'Hydrocureuse (occasion)',ic:'🚛',p:145000,u:150,veh:'h'}
};
const ADM={
  bce:{n:"Inscription à la BCE",ic:'🧾',p:95,d:"Numéro d'entreprise et TVA. Obligatoire pour faire des factures."},
  rc:{n:'Assurance RC professionnelle',ic:'🛡️',p:350,d:'Premier trimestre payé, ensuite environ 3,50 € par jour.'},
  vca:{n:'Certification sécurité VCA',ic:'🦺',p:1800,d:'Exigée par le SPW pour travailler sur la voie publique.'}
};
// Agréation des entrepreneurs (au-delà de 75 000 € HTVA)
const CLS=[{max:75000},
  {max:135000,ca:60000,w:3,r:30,c:450},{max:275000,ca:150000,w:5,r:40,c:450},{max:500000,ca:300000,w:8,r:50,c:650},
  {max:900000,ca:600000,w:12,r:60,c:650},{max:1500000,ca:1000000,w:18,r:70,c:850}];
// Travaux. rate = quantité par jour pour un ouvrier normal ; pu = prix unitaire HTVA.
// p:1 = petit boulot privé ; sinon marché SPW. pc:1 = il faut un permis C dans l'équipe.
const JOBS={
  p_dechets:{p:1,n:'Ramassage de déchets',ic:'🗑️',un:'sacs',rate:10,pu:26,need:[],minW:1,vis:'dechets',tool:'pince',ac:'#7bd88f'},
  p_tonte:{p:1,n:'Tonte de pelouse',ic:'🌱',un:'m²',rate:2500,pu:0.13,need:['tondeuse'],minW:1,vis:'lawn',tool:'tondeuse',mo:[4,10],ac:'#8be05a'},
  p_haie:{p:1,n:'Taille de haies',ic:'✂️',un:'m',rate:70,pu:5,need:['taillehaie'],minW:1,vis:'hedge',tool:'haie',ac:'#4fc06a'},
  p_debrous:{p:1,n:'Débroussaillage de terrain',ic:'🌿',un:'m²',rate:600,pu:0.55,need:['debrou'],minW:1,vis:'bush',tool:'debrou',mo:[3,11],ac:'#55b24a'},
  p_feuilles:{p:1,n:'Ramassage des feuilles',ic:'🍂',un:'m²',rate:2000,pu:0.15,need:['souffleur'],minW:1,vis:'leaves',tool:'souffleur',mo:[10,12],ac:'#e39a3b'},
  p_karcher:{p:1,n:'Nettoyage de cour et terrasse',ic:'💦',un:'m²',rate:100,pu:3.5,need:['karcher'],minW:1,vis:'paving',tool:'lance',ac:'#5fc3ff'},
  p_verts:{p:1,n:'Évacuation de déchets verts',ic:'🪵',un:'m³',rate:8,pu:42,need:['remorque'],minW:1,vis:'branches',tool:'',ac:'#b5894f'},
  p_neige:{p:1,n:'Déneigement de trottoirs',ic:'❄️',un:'m²',rate:300,pu:1,need:[],minW:1,vis:'snow',tool:'pelle',mo:[12,2],ac:'#bfe3ff'},
  dechets:{n:'Ramassage des déchets le long des routes',ic:'🗑️',un:'km',q0:5,rate:2,pu:240,need:['van','signal'],minW:2,vis:'dechets',tool:'pince',ac:'#7bd88f'},
  panneaux:{n:'Nettoyage des panneaux de signalisation',ic:'🪧',un:'panneaux',q0:60,rate:22,pu:22,need:['van','karcher','signal'],minW:2,vis:'signs',tool:'lance',ac:'#4fb3ff'},
  glissieres:{n:'Nettoyage des glissières de sécurité',ic:'🛣️',un:'km',q0:4,rate:1.2,pu:420,need:['van','karcher','signal','fleche'],minW:2,vis:'rail',tool:'lance',ac:'#a9b8c8'},
  debrous:{n:'Débroussaillage des talus',ic:'🌿',un:'km',q0:3,rate:0.35,pu:1400,need:['van','debrou','signal'],minW:2,vis:'bush',tool:'debrou',mo:[3,10],ac:'#55b24a'},
  fauchage:{n:'Fauchage des accotements',ic:'🌾',un:'km',q0:40,rate:8,pu:85,need:['tracteur','fleche','signal'],minW:2,pc:1,vis:'grass',tool:'',mach:'tracteur',mo:[5,10],ac:'#c7d94f'},
  balayage:{n:"Balayage des filets d'eau",ic:'🧹',un:'km',q0:40,rate:10,pu:55,need:['balayeuse','fleche'],minW:2,pc:1,vis:'sweep',tool:'',mach:'balayeuse',ac:'#ffd23f'},
  elagage:{n:"Élagage des arbres d'alignement",ic:'🌳',un:'arbres',q0:30,rate:8,pu:75,need:['nacelle','broyeur','fleche','signal'],minW:3,pc:1,vis:'trees',tool:'',mach:'nacelle',mo:[10,3],ac:'#3fa34d'},
  avaloirs:{n:'Curage des avaloirs',ic:'🕳️',un:'avaloirs',q0:120,rate:35,pu:16,need:['hydro','fleche','signal'],minW:2,pc:1,vis:'drains',tool:'',mach:'hydro',ac:'#e8742c'}
};
const SPWJ=Object.keys(JOBS).filter(k=>!JOBS[k].p),PJ=Object.keys(JOBS).filter(k=>JOBS[k].p);
const ROADS=['N4','N5','N25','N40','N54','N63','N80','N89','N90','N97','N83','N86','E411','E42','E25','E19','A15','R3','R9'];

const CLIENTS=[['Mme Lambert','part'],['M. Dupont','part'],['Mme Collignon','part'],['M. Henrard','part'],['Mme Pirard','part'],['M. Lejeune','part'],['M. et Mme Gilson','part'],
  ['Résidence Les Tilleuls','pro'],['Camping du Lac','pro'],['Supermarché du coin','pro'],['Garage Renard','pro'],['Ferme Delvaux','pro'],['Maison de repos Les Lilas','pro'],['Syndic Le Parc','pro'],['Club de foot','pro'],

const WX=[{ic:'☀️',n:'Soleil',f:1,k:'sun'},{ic:'⛅',n:'Nuageux',f:1,k:'cloud'},{ic:'🌧️',n:'Pluie',f:0.6,k:'rain'},{ic:'⛈️',n:'Orage',f:0,k:'storm'},{ic:'❄️',n:'Neige',f:0.3,k:'snow'}];

/* =====================================================================
   SAUVEGARDE — ne jamais changer SAVE : la progression des joueurs en dépend.
   Nouveaux champs : les ajouter dans defaults(), migrate() les complète.
   ===================================================================== */
const SAVE='routenette-save',BAK='routenette-bak',SCHEMA=1;
let st=null;
function defaults(){return{schema:SCHEMA,name:'Ma petite entreprise',cash:250,rep:10,day:0,adm:{},cls:0,loan:0,nid:2,
  workers:[{id:1,n:'Toi (le patron)',boss:1,sk:1,sal:0,pc:0,skin:0}],eq:{},tenders:[],jobs:[],contracts:[],inv:[],cand:[],log:[],
  stats:{won:0,lost:0,done:0,ca:0,spw:0,earned:0},goals:{},sel:null,wx:0,started:false,snd:1,lastLost:null,over:false}}
function migrate(s){const d=defaults();
  for(const k in d)if(s[k]===undefined||s[k]===null&&d[k]!==null)s[k]=d[k];
  for(const k in d.stats)if(s.stats[k]===undefined)s.stats[k]=d.stats[k];
  // éléments retirés du jeu : on rembourse au lieu de perdre
  for(const k in s.eq)if(!EQ[k]){delete s.eq[k]}
  s.contracts=s.contracts.filter(c=>JOBS[c.j]);s.tenders=s.tenders.filter(t=>JOBS[t.j]);s.jobs=s.jobs.filter(o=>JOBS[o.j]);
  s.workers.forEach(w=>{if(w.skin===undefined)w.skin=RI(0,SKIN.length-1);if(w.pc===undefined)w.pc=0});
  s.schema=SCHEMA;return s}
function load(){for(const k of[SAVE,BAK]){try{const s=JSON.parse(localStorage.getItem(k));if(s&&typeof s==='object'&&s.workers)return migrate(s)}catch(e){}}return null}
function save(){try{const j=JSON.stringify(st);localStorage.setItem(SAVE,j);if(st.day%5===0)localStorage.setItem(BAK,j)}catch(e){}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
addEventListener('visibilitychange',()=>{if(document.hidden&&st)save()});
addEventListener('pagehide',()=>{if(st)save()});

/* ===================================================================== */
const date=d=>new Date(2027,2,1+d);
const month=()=>date(st.day).getMonth()+1;
const dstr=d=>{const x=date(d);return x.getDate()+' '+MOIS[x.getMonth()]};
function inSeason(J,m){if(!J.mo)return true;const[a,b]=J.mo;return a<=b?(m>=a&&m<=b):(m>=a||m<=b)}
function log(t,toast){st.log.unshift({d:st.day,t});if(st.log.length>80)st.log.length=80;if(toast!==false)toastMsg(t)}
function toastMsg(t){const T=$('#toast');while(T.children.length>=3)T.firstChild.remove();const d=document.createElement('div');d.innerHTML=t;T.appendChild(d);setTimeout(()=>d.remove(),3500)}
let AC=null;
function snd(f,d,type,v,delay){if(!st||!st.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),gn=AC.createGain();o.type=type||'sine';o.frequency.value=f;o.connect(gn);gn.connect(AC.destination);const t=AC.currentTime+(delay||0);gn.gain.setValueAtTime(v||.06,t);gn.gain.exponentialRampToValueAtTime(.0001,t+(d||.12));o.start(t);o.stop(t+(d||.12)+.02)}catch(e){}}
const kaching=()=>{snd(880,.08,'triangle',.07);snd(1320,.2,'triangle',.07,.08)};
const click=()=>snd(520,.05,'square',.03);
const ownW=()=>st.workers.length;
const hasPC=ws=>ws.some(w=>w.pc);
const vehCount=()=>Object.keys(st.eq).reduce((a,k)=>a+(EQ[k].veh?st.eq[k]:0),0);

/* ---------- Coûts fixes (par jour) ---------- */
function fixedList(){const L=[];
  if(st.adm.bce)L.push(['Cotisations sociales d’indépendant',9]);
  if(st.adm.rc)L.push(['Assurance RC professionnelle',3.5]);
  if(ownW()>1)L.push(['Secrétariat social et comptable',6]);
  let vl=0,vh=0;for(const k in st.eq){if(EQ[k].veh==='l')vl+=st.eq[k];if(EQ[k].veh==='h')vh+=st.eq[k]}
  if(vl)L.push([`Assurance et taxe : ${vl} véhicule(s) léger(s)`,vl*3.6]);
  if(vh)L.push([`Assurance et taxe : ${vh} poids lourd(s)`,vh*9.6]);
  if(vehCount()>=3)L.push(['Location du hangar',30]);
  if(st.loan)L.push(['Intérêts du prêt (5 %/an)',st.loan*0.05/365]);
  return L}
const fixed=()=>fixedList().reduce((a,x)=>a+x[1],0);
const salaries=()=>st.workers.reduce((a,w)=>a+w.sal,0);

/* ---------- Petits boulots ---------- */
function genJob(force){const m=month();const ok=PJ.filter(k=>inSeason(JOBS[k],m));const j=force||pick(ok),J=JOBS[j];
  const big=1+Math.min(4,ownW()-1)*0.5;const step=J.rate>=100?25:1;
  const q=Math.max(step,Math.round(J.rate*R(0.6,3)*big/step)*step);
  const price=Math.max(45,Math.round(q*J.pu*R(0.95,1.2)/5)*5);const cl=pick(CLIENTS);
  st.jobs.push({id:st.nid++,j,q,price,dur:Math.ceil(q/J.rate)+RI(2,5),client:cl[0],ct:cl[1],town:pick(TOWNS),until:st.day+RI(2,6)});
}
function jobMiss(o){const J=JOBS[o.j];const r=[];if(!st.adm.bce)r.push('🧾 Inscription BCE');J.need.forEach(t=>{if(!(st.eq[t]>0))r.push(EQ[t].ic+' '+EQ[t].n+' ('+eur(EQ[t].p)+')')});return r}
function acceptJob(id){const o=st.jobs.find(x=>x.id===id);if(!o)return;if(jobMiss(o).length)return;click();
  st.jobs.splice(st.jobs.indexOf(o),1);
  const c={id:st.nid++,j:o.j,q:o.q,road:o.client,ct:o.ct,town:o.town,price:o.price,prog:0,vis:0,deadline:st.day+o.dur,startBy:st.day+2,st:'wait',crew:[],own:{},pen:0,paid:0,half:false,seed:RI(1,99999),tap:{},nRef:1};
  st.contracts.push(c);save();startUI(c.id)}

/* ---------- Marchés SPW ---------- */
function clsFor(v){for(let k=0;k<CLS.length;k++)if(v<=CLS[k].max)return k;return CLS.length-1}
function genTender(forceJob,urgent){
  const m=month(),ok=SPWJ.filter(k=>inSeason(JOBS[k],m));
  const j=forceJob||pick(ok),J=JOBS[j];
  const top=Math.min(CLS.length-1,st.cls+(Math.random()<0.3?1:0));
  const maxV=CLS[top].max;
  let V=urgent?R(3000,9000):3000+(maxV-3000)*Math.pow(Math.random(),2.4);
  V=Math.max(V,J.q0*J.pu);
  const q=Math.max(J.q0,Math.round(V/J.pu));
  const est=Math.round(q*J.pu*R(0.93,1.08)/10)*10;
  const dT=clamp(Math.sqrt(est)*0.3,5,150);
  const nRef=Math.max(J.minW,Math.ceil(est/(J.rate*J.pu*dT)));
  const dur=urgent?Math.ceil(q/(J.rate*nRef))+3:Math.ceil(q/(J.rate*nRef)*R(1.3,1.6))+2;
  st.tenders.push({id:st.nid++,j,q,est,dur,nRef,road:pick(ROADS),town:pick(TOWNS),bidEnd:st.day+(urgent?2:RI(5,12)),bid:null,cls:clsFor(est),urgent:!!urgent});
}
function spwReq(t){const J=JOBS[t.j];const r=[];
  r.push({ok:!!st.adm.bce,tx:'🧾 BCE'});r.push({ok:!!st.adm.rc,tx:'🛡️ Assurance RC'});r.push({ok:!!st.adm.vca,tx:'🦺 VCA'});
  if(t.cls>0)r.push({ok:st.cls>=t.cls,tx:`🏅 Agréation classe ${t.cls}`});
  r.push({ok:ownW()>=J.minW,tx:`👷 ${J.minW} personnes`});
  if(J.pc)r.push({ok:hasPC(st.workers),tx:'🪪 Permis C'});
  for(const k of J.need)r.push({ok:(st.eq[k]||0)>0,tx:EQ[k].ic+' '+EQ[k].n});
  return r}
const reqHtml=r=>'<div class="req">'+r.map(x=>`<span style="color:${x.ok?'#9df0b7':'#ffaaa4'}">${x.ok?'✅':'❌'} ${x.tx}</span>`).join('')+'</div>';
function freeEq(t,ex){let u=0;for(const c of st.contracts)if(c.st==='run'&&c!==ex)u+=(c.own[t]||0);return(st.eq[t]||0)-u}
function freeW(ex){const busy=new Set();for(const c of st.contracts)if(c.st==='run'&&c!==ex)c.crew.forEach(i=>busy.add(i));return st.workers.filter(w=>!busy.has(w.id))}
function eqPlan(j,ex){const own={},miss=[];let day=0;for(const t of JOBS[j].need){if(freeEq(t,ex)>0){own[t]=1;day+=EQ[t].u}else miss.push(t)}return{own,miss,day}}
function costEst(t){const J=JOBS[t.j];const ws=st.workers.slice().sort((a,b)=>b.sk-a.sk);const n=Math.max(1,Math.min(ws.length,Math.max(t.nRef,J.minW)));
  const crew=ws.slice(0,n);const pw=crew.reduce((a,w)=>a+w.sk,0);const sal=crew.reduce((a,w)=>a+(w.sal||0),0);
  const days=Math.ceil(t.q/(J.rate*pw));let eqd=0;J.need.forEach(k=>eqd+=EQ[k].u);return{days,n,cost:days*(sal+eqd)}}
function resolveBid(t){
  const n=RI(2,5)+(t.est>100000?1:0);const bids=[{n:st.name,p:t.bid,r:st.rep,me:1}];
  const used=new Set();for(let i=0;i<n;i++){let nm;do nm=pick(RIV);while(used.has(nm));used.add(nm);bids.push({n:nm,p:Math.round(t.est*R(0.9,1.18)/10)*10,r:RI(25,75)})}
  const mn=Math.min(...bids.map(b=>b.p));bids.forEach(b=>b.s=75*mn/b.p+25*b.r/100);bids.sort((a,b)=>b.s-a.s);
  const J=JOBS[t.j];
  const tbl='<table>'+bids.map((b,i)=>`<tr><td>${i===0?'🥇':i+1+'.'} ${b.me?'<b style="color:var(--or2)">'+b.n+'</b>':b.n}</td><td>${eur(b.p)}</td><td>${b.s.toFixed(1)} pts</td></tr>`).join('')+'</table>';
  if(bids[0].me){st.stats.won++;
    const c={id:st.nid++,j:t.j,q:t.q,road:t.road,town:t.town,price:t.bid,prog:0,vis:0,deadline:st.day+3+t.dur,startBy:st.day+7,st:'wait',crew:[],own:{},pen:0,paid:0,half:false,seed:RI(1,99999),tap:{},nRef:t.nRef};
    st.contracts.push(c);log(`🎉 Marché SPW gagné : ${J.ic} ${J.n} (${t.road}) pour ${eur(t.bid)} !`,false);kaching();
    showModal(`<h3>🎉 Marché attribué !</h3><div class="hd"><div class="ic" style="--ac2:${J.ac}33">${J.ic}</div><div><b>${J.n}</b><div class="mut">${t.road} — ${t.town}</div></div></div><p class="mut">Ouverture des offres au SPW :</p>${tbl}<p>Commence avant le <b>${dstr(c.startBy)}</b>, termine avant le <b>${dstr(c.deadline)}</b>.</p><div class="row"><button class="btn" onclick="closeM();startUI(${c.id})">Lancer le chantier</button><button class="btn s" onclick="closeM()">Plus tard</button></div>`);
  }else{st.stats.lost++;const i=bids.findIndex(b=>b.me);
    log(`❌ Marché perdu (${J.n}, ${t.road}) : ${bids[0].n} gagne à ${eur(bids[0].p)}. Tu es ${i+1}e.`);
    st.lastLost={t:`${J.ic} ${J.n} — ${t.road}`,tbl};}
}

/* ---------- Simulation d'une journée ---------- */
function weather(){const m=month(),r=Math.random(),w=m===12||m<=2;
  if(w&&r<0.22)return 4;if(r<0.05)return 3;if(r<(w?0.45:0.3))return 2;if(r<0.55)return 1;return 0}
function invoice(c,amt,delay,lbl){st.inv.push({id:st.nid++,amt:Math.round(amt),due:st.day+delay,from:lbl})}
function tick(){
  st.day++;st.wx=weather();const wf=WX[st.wx].f;
  st.cash-=salaries()+fixed();
  for(const c of [...st.contracts]){const J=JOBS[c.j];
    if(c.st==='wait'&&st.day>c.startBy){st.contracts.splice(st.contracts.indexOf(c),1);
      if(J.p){st.rep=clamp(st.rep-2,0,100);log(`😠 ${c.road} a pris quelqu'un d'autre : tu n'es jamais venu. Réputation -2.`)}
      else{st.rep=clamp(st.rep-10,0,100);const f=Math.round(c.price*0.05);st.cash-=f;log(`⚖️ Le SPW résilie le marché ${J.n} : jamais commencé. Amende ${eur(f)}, réputation -10.`)}continue}
    if(c.st!=='run')continue;
    let eqc=0;for(const t in c.own)eqc+=c.own[t]*EQ[t].u;st.cash-=eqc;
    const crew=c.crew.map(i=>st.workers.find(w=>w.id===i)).filter(Boolean);
    c.prog=Math.min(c.q,c.prog+J.rate*crew.reduce((a,w)=>a+w.sk,0)*wf);
    crew.forEach(w=>w.sk=Math.min(1.5,+(w.sk+0.0025).toFixed(4)));
    if(st.day>c.deadline)c.pen=Math.min(c.price*0.2,c.pen+c.price*(J.p?0.04:0.01));
    if(!J.p&&!c.half&&c.prog>=c.q/2){c.half=true;const a=Math.round(c.price*0.45);c.paid+=a;invoice(c,a,30,`SPW — état d'avancement (${J.n})`);log(`📄 État d'avancement envoyé au SPW : ${eur(a)}, payé dans 30 jours.`)}
    if(c.prog>=c.q)finish(c);
  }
  for(const v of [...st.inv])if(st.day>=v.due){st.inv.splice(st.inv.indexOf(v),1);st.cash+=v.amt;st.stats.earned+=v.amt;log(`💶 Paiement reçu : +${eur(v.amt)} — ${v.from}`);kaching()}
  for(const t of [...st.tenders])if(st.day>=t.bidEnd){st.tenders.splice(st.tenders.indexOf(t),1);if(t.bid)resolveBid(t)}
  if(st.tenders.length<8&&Math.random()<0.5)genTender();
  if(st.tenders.length<4)genTender();
  st.jobs=st.jobs.filter(o=>o.until>=st.day);
  if(st.jobs.length<4+Math.min(5,ownW())&&Math.random()<0.8)genJob();
  if(!st.jobs.some(o=>!JOBS[o.j].need.length))genJob(month()===12||month()<=2&&Math.random()<0.5?'p_neige':'p_dechets');
  if(st.day%7===0)refreshCand();
  events();goals();
  if(st.cash<-15000&&!st.over){st.over=true;showModal(`<h3>💀 Faillite</h3><p>La banque ferme le compte de <b>${st.name}</b> (${eur(st.cash)}).</p><p class="mut">Tu as tenu ${st.day} jours et terminé ${st.stats.done} chantiers.</p><button class="btn w" onclick="restart(1)">Recommencer</button>`)}
  save();render();
}
function finish(c){const J=JOBS[c.j];st.contracts.splice(st.contracts.indexOf(c),1);
  const crew=c.crew.map(i=>st.workers.find(w=>w.id===i)).filter(Boolean);const avg=crew.reduce((a,w)=>a+w.sk,0)/Math.max(1,crew.length);
  let rest=c.price-c.paid-c.pen,msg='';const late=st.day>c.deadline;
  let dr=J.p?(late?-2:st.rep<40?RI(1,2):0):(late?-RI(3,7):RI(2,4)+(c.price>100000?2:0));
  if(!J.p&&Math.random()<(1.25-avg)*0.6){dr-=2;rest-=c.price*0.03;msg=' Le contrôleur du SPW a demandé des retouches.'}
  st.rep=clamp(st.rep+dr,0,100);st.stats.done++;st.stats.ca+=c.price-c.pen;if(!J.p)st.stats.spw++;if(st.sel===c.id)st.sel=null;
  if(J.p){
    if(c.ct==='part'&&Math.random()<0.7){st.cash+=rest;st.stats.earned+=rest;kaching();log(`✅ ${J.n} chez ${c.road} terminé : payé tout de suite +${eur(rest)} ${late?'(en retard)':''}`)}
    else{const d=c.ct==='com'?30:c.ct==='pro'?RI(10,30):RI(5,15);invoice(c,rest,d,c.road);log(`✅ ${J.n} chez ${c.road} terminé : facture de ${eur(rest)}, payée dans ${d} jours.`)}
    return}
  invoice(c,rest,30,`SPW — décompte final (${J.n})`);
  showModal(`<h3>✅ Chantier SPW terminé</h3><div class="hd"><div class="ic" style="--ac2:${J.ac}33">${J.ic}</div><div><b>${J.n}</b><div class="mut">${c.road} — ${c.town}</div></div></div><table style="margin-top:10px">
  <tr><td>Prix du marché</td><td>${eur(c.price)}</td></tr><tr><td>État d'avancement déjà facturé</td><td>${eur(c.paid)}</td></tr>
  ${c.pen?`<tr><td>Amendes de retard</td><td class="neg">-${eur(c.pen)}</td></tr>`:''}<tr><td><b>Décompte final</b> (payé dans 30 jours)</td><td class="money">${eur(rest)}</td></tr>
  <tr><td>Réputation</td><td>${dr>0?'+':''}${dr}</td></tr></table><p class="mut">${late?'En retard sur le délai.':'Dans les délais, bravo !'}${msg}</p><button class="btn w" onclick="closeM()">Super</button>`);
  log(`✅ ${J.n} (${c.road}) terminé. Réputation ${dr>0?'+':''}${dr}`,false);
}
function events(){if(Math.random()>0.05)return;const run=st.contracts.filter(c=>c.st==='run');const r=Math.random();
  const big=Object.keys(st.eq).some(k=>st.eq[k]>0&&EQ[k].p>10000);
  if(r<0.22&&Object.keys(st.eq).some(k=>st.eq[k]>0)){const k=big?RI(350,2800):RI(40,180);st.cash-=k;log(`🔧 Panne de matériel : réparation ${eur(k)}`)}
  else if(r<0.4&&st.adm.vca){genTender('dechets',true);log('🚨 Dépôt clandestin signalé ! Marché urgent dans 🏛️ SPW.')}
  else if(r<0.58&&run.length){st.rep=clamp(st.rep+2,0,100);log('👍 Un client est ravi et parle de toi : réputation +2')}
  else if(r<0.72){const k=RI(20,80);st.cash+=k;log(`🎁 Pourboire d'un client content : +${eur(k)}`)}
  else if(r<0.85&&run.length&&big){const k=RI(250,1200);st.cash-=k;log(`🚗 Un automobiliste a renversé des cônes. Franchise d'assurance : ${eur(k)}`)}
  else if(st.adm.bce){const k=RI(150,1500);st.cash+=k;log(`🏦 Remboursement de TVA : +${eur(k)}`)}
}
function mkW(){const r=Math.random();let ty,sk,sal,pc=0;
  if(r<0.3){ty='Étudiant jobiste';sk=R(0.6,0.8);sal=RI(115,135)}
  else if(r<0.8){ty='Ouvrier';sk=R(0.85,1.1);sal=RI(215,245);pc=Math.random()<0.15?1:0}
  else{ty='Ouvrier expérimenté';sk=R(1.12,1.3);sal=RI(260,300);pc=Math.random()<0.55?1:0}
  return{id:st.nid++,n:pick(PREN)+' '+String.fromCharCode(65+RI(0,25))+'.',ty,sk:+sk.toFixed(2),sal,pc,skin:RI(0,SKIN.length-1)}}
function refreshCand(){st.cand=[mkW(),mkW(),mkW(),mkW()]}
const GOALS=[
  {k:'g0',t:"Inscris ton entreprise à la BCE (📊 Entreprise)",ok:()=>!!st.adm.bce},
  {k:'g1',t:'Termine ton premier petit boulot',ok:()=>st.stats.done>=1},
  {k:'g2',t:'Achète ta première machine (🚜 Matériel)',ok:()=>Object.values(st.eq).some(n=>n>0)},
  {k:'g3',t:'Atteins 3 000 € en caisse',ok:()=>st.cash>=3000},
  {k:'g4',t:'Embauche ton premier ouvrier (👷 Équipe)',ok:()=>ownW()>=2},
  {k:'g5',t:'Achète une camionnette',ok:()=>st.eq.van>0},
  {k:'g6',t:"Assurance RC + certification VCA : accès au SPW",ok:()=>st.adm.rc&&st.adm.vca},
  {k:'g7',t:'Gagne ton premier marché SPW',ok:()=>st.stats.won>=1},
  {k:'g8',t:'Obtiens l’agréation classe 1',ok:()=>st.cls>=1},

let pickSel=[];
function startUI(id){const c=st.contracts.find(x=>x.id===id);if(!c)return;const J=JOBS[c.j];
  const fw=freeW(c).sort((a,b)=>(J.pc?b.pc-a.pc:0)||b.sk-a.sk);
  pickSel=c.st==='run'?c.crew.filter(i=>fw.some(w=>w.id===i)):fw.slice(0,Math.max(J.minW,c.nRef)).map(w=>w.id);
  startDraw(id);}
function startDraw(id){const c=st.contracts.find(x=>x.id===id),J=JOBS[c.j];const fw=freeW(c).sort((a,b)=>b.sk-a.sk);
  const sel=fw.filter(w=>pickSel.includes(w.id));const n=sel.length,p=eqPlan(c.j,c);const pw=sel.reduce((a,w)=>a+w.sk,0);
  const days=pw?Math.ceil((c.q-c.prog)/(J.rate*pw)):'∞';const left=c.deadline-st.day;const pcOk=!J.pc||hasPC(sel);

  showModal(`<h3>${c.st==='run'?"Modifier l'équipe":'Lancer le chantier'}</h3><div class="hd"><div class="ic" style="--ac2:${J.ac}33">${J.ic}</div><div><b>${J.n}</b><div class="mut">${c.road} — ${c.town}</div></div></div>
  <div class="tags"><span class="tag">Reste ${nb(c.q-c.prog)} ${J.un}</span><span class="tag ${left<0?'r':''}">Délai : ${left} jours</span><span class="tag g">${eur(c.price)}</span></div>
  <h2>Qui y va ? (minimum ${J.minW}${J.pc?', dont un permis C':''})</h2><div>${fw.map(w=>`<span class="chip ${pickSel.includes(w.id)?'on':''}" onclick="togW(${c.id},${w.id})">${w.boss?'⭐':'👷'} ${w.n.split(' ')[0]} ${'●'.repeat(Math.round(w.sk*3))}${w.pc?' 🪪':''}</span>`).join('')||'<span class="mut">Tout le monde est déjà sur un chantier.</span>'}</div>
  ${J.need.length?`<h2>Matériel</h2>${J.need.map(t=>`<div class="row" style="margin:3px 0">${EQ[t].ic} ${EQ[t].n} ${p.own[t]?'<span class="tag g">OK</span>':'<span class="tag r">utilisé sur un autre chantier</span>'}</div>`).join('')}`:'<p class="mut">Pas de machine : pince, gants et sacs suffisent.</p>'}
  <div class="card" style="margin:12px 0"><div>Durée prévue : <b>${days} jours</b> ${days!=='∞'&&days>left?'<span class="tag r">trop lent !</span>':'<span class="tag g">OK</span>'}</div><div class="mut">Coût par jour : ${eur(cost)} (salaires + carburant)</div>${!pcOk?'<div class="neg">Il faut un permis C dans l’équipe.</div>':''}</div>
  <div class="row"><button class="btn" ${n<J.minW||p.miss.length||!pcOk?'disabled':''} onclick="startGo(${c.id})">C'est parti !</button><button class="btn s" onclick="closeM()">${c.st==='run'?'Annuler':'Plus tard'}</button></div>`);}
function togW(cid,wid){click();const i=pickSel.indexOf(wid);i<0?pickSel.push(wid):pickSel.splice(i,1);startDraw(cid)}
function startGo(id){const c=st.contracts.find(x=>x.id===id);const p=eqPlan(c.j,c);if(p.miss.length)return;c.own=p.own;c.crew=[...pickSel];
  if(c.st!=='run'){c.st='run';log(`🦺 Chantier lancé : ${JOBS[c.j].n} (${c.road})`,false)}st.sel=c.id;closeM();snd(440,.08,'square',.04);snd(660,.12,'square',.04,.08);save();tab('ch')}
function hire(i){const w=st.cand[i];if(!st.adm.bce)return toastMsg("Inscris d'abord ton entreprise à la BCE.");if(st.cash<w.sal*10)return toastMsg(`Économise d'abord : il faut de quoi payer 2 semaines de salaire (${eur(w.sal*10)}).`);
  st.cand.splice(i,1);st.workers.push(w);log(`👷 ${w.n} rejoint l'équipe (${eur(w.sal)}/jour)`,false);kaching();goals();save();render()}
function fire(id){const w=st.workers.find(x=>x.id===id);if(!w||w.boss)return;if(st.contracts.some(c=>c.st==='run'&&c.crew.includes(id)))return toastMsg("Il est sur un chantier : retire-le d'abord.");
  if(!confirm(`Licencier ${w.n} ? Préavis : ${eur(w.sal*10)}`))return;st.cash-=w.sal*10;st.workers.splice(st.workers.indexOf(w),1);save();render()}
function trainPC(id){const w=st.workers.find(x=>x.id===id);if(!w||w.pc)return;if(st.cash<2800)return toastMsg('Il faut 2 800 € pour la formation au permis C.');st.cash-=2800;w.pc=1;log(`🪪 ${w.n} a obtenu le permis C !`);save();render()}
function buy(t){const e=EQ[t];if(st.cash<e.p)return toastMsg(`Pas assez d'argent : il manque ${eur(e.p-st.cash)}.`);st.cash-=e.p;st.eq[t]=(st.eq[t]||0)+1;log(`🛒 Achat : ${e.ic} ${e.n}`,false);kaching();goals();save();render()}
function sell(t){if(freeEq(t)<1)return toastMsg('Ce matériel est utilisé sur un chantier.');if(!confirm(`Revendre ${EQ[t].n} pour ${eur(EQ[t].p*0.55)} ?`))return;const v=Math.round(EQ[t].p*0.55);st.eq[t]--;st.cash+=v;log(`💰 Revente : ${EQ[t].n} +${eur(v)}`,false);save();render()}
function buyAdm(k){const a=ADM[k];if(st.adm[k])return;if(k!=='bce'&&!st.adm.bce)return toastMsg("Inscris d'abord ton entreprise à la BCE.");if(st.cash<a.p)return toastMsg(`Il manque ${eur(a.p-st.cash)}.`);st.cash-=a.p;st.adm[k]=1;log(`${a.ic} ${a.n} : c'est fait !`);kaching();goals();save();render()}
function upCls(){const u=CLS[st.cls+1];if(!u)return;if(!(st.adm.vca&&st.adm.rc))return;if(st.rep<u.r||st.stats.ca<u.ca||ownW()<u.w||st.cash<u.c)return;
  st.cash-=u.c;st.cls++;log(`🏅 Agréation classe ${st.cls} : marchés jusqu'à ${eur(CLS[st.cls].max)} !`);kaching();goals();save();render()}
const loanMax=()=>st.adm.bce?Math.round((5000+st.stats.ca*0.4)/5000)*5000:0;
function loan(k){if(k>0){if(st.loan+5000>loanMax())return toastMsg(st.adm.bce?'La banque refuse : montant maximum atteint. Fais plus de chiffre d’affaires.':"La banque ne prête qu'aux entreprises inscrites à la BCE.");st.loan+=5000;st.cash+=5000;kaching()}else{if(st.loan<=0||st.cash<5000)return;st.loan-=5000;st.cash-=5000}save();render()}

let curTab='ch',speed=1,modalOpen=false,playing=false;

const stars=r=>'★'.repeat(Math.max(1,Math.round(r/20)))+'☆'.repeat(5-Math.max(1,Math.round(r/20)));

function render(){
  $('#cash').textContent=eur(st.cash);$('#cash').classList.toggle('neg',st.cash<0);

function goalCard(){const g=curGoal();return g?`<div class="goal"><span class="gi">🎯</span><div><b>Objectif</b><div>${g.t}</div></div></div>`:''}
function jobHead(J,sub,right){return`<div class="hd"><div class="ic" style="--ac2:${J.ac}2e">${J.ic}</div><div style="flex:1;min-width:0"><h3>${J.n}</h3><div class="mut">${sub}</div></div>${right||''}</div>`}
function rCh(){let h=goalCard();const cs=st.contracts;
  if(!st.adm.bce)h+=`<div class="card acc" style="--ac:var(--ye)"><h3>👋 Bienvenue, patron !</h3><p>Tu pars de zéro : ${eur(250)} en poche, une pince, des gants et des sacs. Pas d'ouvrier, pas de machine.</p><p class="mut">Première étape : inscrire ton entreprise à la Banque-Carrefour des Entreprises pour pouvoir faire des factures.</p><button class="btn w" onclick="buyAdm('bce')">🧾 M'inscrire à la BCE (95 €)</button></div>`;
  else if(!cs.length)h+=`<div class="card"><h3>Aucun chantier en cours</h3><p class="mut">Prends un travail dans <b>🧰 Boulots</b>${st.adm.vca?' ou réponds à un marché dans <b>🏛️ SPW</b>':''}.</p><button class="btn w" onclick="tab('pb')">Voir les petits boulots</button></div>`;
  const firstRun=cs.find(x=>x.st==='run');
  for(const c of cs){const J=JOBS[c.j],pc=c.prog/c.q*100,left=c.deadline-st.day;

    if(c.st==='wait')h+=`<div class="tags"><span class="tag o">À commencer avant le ${dstr(c.startBy)}</span></div><p style="margin:10px 0 0"><button class="btn w" onclick="startUI(${c.id})">🦺 Lancer le chantier</button></p>`;
    else{const crew=c.crew.map(i=>st.workers.find(w=>w.id===i)).filter(Boolean);const shown=st.sel===c.id||(!cs.some(x=>x.id===st.sel&&x.st==='run')&&firstRun===c);

      <div class="mut sm" style="margin-top:4px">👷 ${crew.map(w=>w.n.split(' ')[0]).join(', ')}${J.p?'':' · '+eur(c.price)}</div><div class="row" style="margin-top:10px"><button class="btn s" onclick="st.sel=${c.id};render()">${shown?'👁 À l’écran':'👁 Regarder'}</button><button class="btn s" onclick="startUI(${c.id})">👷 Équipe</button></div>`}

  return h}
function rPb(){let h=goalCard()+`<h2>Petits boulots — particuliers, commerces, communes</h2>`;
  if(!st.adm.bce)h+=`<div class="card acc" style="--ac:var(--rd)"><b>🔒 Inscris d'abord ton entreprise à la BCE</b><p class="mut">Sans numéro d'entreprise, tu ne peux pas faire de facture.</p><button class="btn w" onclick="buyAdm('bce')">🧾 M'inscrire (95 €)</button></div>`;

    if(mach==='tracteur'){tractor(sx-56,yNear-2,t,yWork);if(J.need.includes('fleche'))arrowTrailer(sx-150,yNear-2,t)}
    else if(mach==='balayeuse'){sweeper(sx-34,yNear-2,t);arrowTrailer(sx-140,yNear-2,t)}
    else if(mach==='nacelle'){nacelleTruck(sx-70,yNear-2,t,sx+4,CH*.3);arrowTrailer(sx-170,yNear-2,t)}
    else if(mach==='hydro'){hydroTruck(sx-50,yNear-2,t,sx+6,yNear-4);arrowTrailer(sx-160,yNear-2,t)}
    else if(st.eq.van>0||J.need.includes('van')){van(sx-95,yNear-2,t,vk==='dechets');if(J.need.includes('fleche'))arrowTrailer(sx-190,yNear-2,t)}
    else oldcar(sx-110,yNear-2,t,J.need.includes('remorque')?(vk==='branches'?2:1):0);
    // ouvriers
    const crew=c.crew.map(id=>st.workers.find(w=>w.id===id)).filter(Boolean);const nShow=Math.min(6,crew.length)-(mach&&mach!=='nacelle'?1:0)-(mach==='nacelle'?1:0);
    for(let k=0;k<Math.max(0,nShow);k++){const w=crew[k+(mach?1:0)]||crew[k];const wx=sx-6-k*22+Math.sin(t*.7+k)*5;const wy=yWork+(k%2)*6;
      let tool=J.tool;if(mach)tool=k===0?'porte':'';if(vk==='branches')tool='porte';
      worker(wx,wy,t,{tool,ph:k*1.9,skin:w.skin,helm:w.boss?'#fff':k%2?'#ffd23f':'#ff9a1f',bag:k%2?'#ffd23f':'#2f79d9'})}
  }else{
    // dépôt / maison quand il n'y a pas de chantier
    const bx=CW*.08;
    if(!st.adm.bce||vehCount()===0){house(bx+50,CH*.98,1.6,'#efe6d6','#a5442f');rr(bx+90,CH*.98-34,46,34,2,'#d9d0bf');rect(bx+94,CH*.98-28,38,28,'#8a8f96');for(let k=0;k<5;k++)rect(bx+94,CH*.98-27+k*5.5,38,1,'#7a7f86')}
    else{rr(bx,CH*.98-64,150,64,3,'#9aa7b3');poly([bx-6,CH*.98-64,bx+75,CH*.98-86,bx+156,CH*.98-64],'#6c7a88');rect(bx+20,CH*.98-46,60,46,'#59646f');for(let k=0;k<8;k++)rect(bx+20,CH*.98-45+k*5.7,60,1.2,'#4b555f');
      rr(bx+90,CH*.98-56,52,16,3,'#ff8a1c');g.fillStyle='#2a1600';g.font='900 8px Nunito,sans-serif';g.fillText(st.name.slice(0,12).toUpperCase(),bx+94,CH*.98-45)}
    let px=bx+250;const order=['hydro','tracteur','balayeuse','nacelle','van','fleche'];
    for(const k of order)for(let n=0;n<Math.min(2,st.eq[k]||0);n++){if(px>CW-30)break;const y=CH*.98;
      if(k==='van'){van(px,y,t,0);px+=95}else if(k==='tracteur'){tractor(px+20,y,t,y,1);px+=110}else if(k==='balayeuse'){sweeper(px,y,t);px+=95}else if(k==='nacelle'){nacelleTruck(px,y,t,px+10,y-70);px+=110}else if(k==='hydro'){hydroTruck(px,y,t,px-70,y);px+=110}else{arrowTrailer(px,y,t);px+=60}}
    if(px===bx+250)oldcar(px+20,CH*.98,t,st.eq.remorque?1:0);
    for(let k=0;k<Math.min(5,ownW());k++)worker(bx+222-k*17,CH*.99-(k%2)*3,t*.3,{tool:'',ph:k,skin:st.workers[k].skin,helm:k===0?'#fff':k%2?'#ffd23f':'#ff9a1f'});
  }
  // touffes au premier plan
  for(let i=Math.floor(camX*1.15/40)-1;i<Math.floor((camX*1.15+CW)/40)+2;i++){const x=i*40-camX*1.15;if(hh(i*41)<.5){const h=6+hh(i*43)*6;for(let k=0;k<4;k++)ln(x+k*3,CH,x+k*3+Math.sin(t*2+i)*1.5-2+k,CH-h,pal.grass2,1.5)}}
  // particules
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.gr||160)*dt;p.l-=dt;if(p.txt){g.globalAlpha=Math.min(1,p.l*2);g.fillStyle='#ffe066';g.font='900 15px Nunito,sans-serif';g.strokeStyle='rgba(0,0,0,.5)';g.lineWidth=3;g.strokeText(p.txt,p.x-camX,p.y);g.fillText(p.txt,p.x-camX,p.y);g.globalAlpha=1}else circ(p.x-camX,p.y,p.r,p.c)}
  parts=parts.filter(p=>p.l>0);if(parts.length>260)parts.splice(0,parts.length-260);
  // météo
  if(wk==='rain'||wk==='storm'){g.strokeStyle='rgba(210,225,240,.55)';g.lineWidth=1;g.beginPath();for(let k=0;k<70;k++){const x=(hh(k*3)*CW+t*60+k*7)%CW,y=(hh(k*7)*CH+t*520)%CH;g.moveTo(x,y);g.lineTo(x-3,y+10)}g.stroke()}
  if(wk==='storm'){if(Math.random()<.004)flash=1;if(flash>0){g.fillStyle=`rgba(255,255,255,${flash*.6})`;g.fillRect(0,0,CW,CH);flash-=dt*3}}
  if(wk==='snow'){for(let k=0;k<60;k++){const x=(hh(k*3)*CW+Math.sin(t+k)*12+t*10)%CW,y=(hh(k*7)*CH+t*40)%CH;circ(x,y,1.2+hh(k)*1.4,'rgba(255,255,255,.9)')}}
  // vignette
  const vg=g.createLinearGradient(0,CH-30,0,CH);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.25)');g.fillStyle=vg;g.fillRect(0,CH-30,CW,30);
  lastT=t;
  // HUD
  const hj=$('#hudJob'),pb=$('#prog');
  if(c){const txt=`${J.ic} ${J.p?c.road:c.road+' · '+c.town}`;if(hj.textContent!==txt)hj.textContent=txt;pb.style.display='block';pb.firstChild.style.width=(c.prog/c.q*100)+'%'}
  else{const txt=st.adm.bce?'🏠 Au dépôt — pas de chantier':'🏠 À la maison';if(hj.textContent!==txt)hj.textContent=txt;pb.style.display='none'}
}
const pick3=(i,a)=>a[Math.abs(i)%a.length];
cv.addEventListener('pointerdown',e=>{const c=selC();if(!c)return;const b=cv.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;
  if(y<CH*.62)return;const wx=x+camX,tx=c.vis/c.q*LEN+220;
  if(wx<tx-10||wx>tx+CW*.45)return;const i=Math.floor(wx/SEG);if(c.tap[i])return;c.tap[i]=1;const J=JOBS[c.j];c.prog=Math.min(c.q,c.prog+c.q*(J.p?0.012:0.0015));
  parts.push({x:wx,y:y-6,vx:0,vy:-50,l:1,gr:30,txt:'+1 👍'});for(let k=0;k<8;k++)parts.push({x:wx,y,vx:R(-70,70),vy:R(-110,-30),l:.6,c:pick(['#ffd23f','#ff9a1f','#fff']),r:2});snd(900+Math.random()*300,.05,'triangle',.04)});

/* ---------- Boucle ---------- */
const SPD=[0,3000,1200,400];let acc=0,prevT=performance.now();
function loop(now){const dt=Math.min(250,now-prevT);prevT=now;if(playing&&!modalOpen&&speed&&!st.over){acc+=dt;if(acc>=SPD[speed]){acc=0;tick()}}draw(now/1000);requestAnimationFrame(loop)}
render();
$('#play').onclick=()=>{playing=true;$('#splash').style.display='none';$('#ins').classList.remove('on');click();
  if(!st.started){st.started=true;save();showModal(`<h3>🦺 Bienvenue dans Route Nette</h3><p>Tu pars de <b>zéro</b> : ${eur(st.cash)} en poche, ta vieille voiture, une pince, des gants et des sacs.</p>
  <div class="card"><div style="margin:4px 0">1️⃣ <b>Inscris-toi à la BCE</b> pour pouvoir facturer.</div><div style="margin:4px 0">2️⃣ Fais des <b>petits boulots</b> (déchets, pelouses, haies…).</div><div style="margin:4px 0">3️⃣ Économise pour acheter des <b>machines</b> et <b>embaucher</b>.</div><div style="margin:4px 0">4️⃣ Assurance, VCA, camionnette : tu peux répondre aux <b>marchés du SPW</b>.</div><div style="margin:4px 0">5️⃣ Grandis : tracteurs, nacelles, hydrocureuses, agréation… 🏆</div></div>
  <p class="mut">Tous les prix sont proches de la réalité (HTVA). Nom de ta société :</p><input type="text" id="nm" value="${esc(st.name)}" maxlength="28"><p></p><button class="btn w" onclick="setName()">C'est parti !</button>`)}};
requestAnimationFrame(loop);
</script>
<script>
// Version du jeu : à changer à chaque mise à jour, avec la même valeur dans version.json.
var APPV="2026-11-03.1";
var SWR=null,BIP=null;
var say=function(t){try{toastMsg(t)}catch(x){}};
if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js?v='+APPV).then(function(r){SWR=r}).catch(function(){})});
(function(){var v=document.getElementById("ver");if(v)v.textContent="Version "+APPV})();
function chkV(man){if(!window.fetch)return;if(SWR)SWR.update().catch(function(){});
 fetch("version.json?"+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(j){
  if(!j||!j.v||j.v===APPV){if(man)say("Le jeu est à jour ✓ (version "+APPV+")");return}
  try{save()}catch(x){}
  document.getElementById("updn").textContent=(j.notes||"")+" Ta progression est conservée.";document.getElementById("ins").classList.remove("on");document.getElementById("upd").classList.add("on")}).catch(function(){if(man)say("Pas de connexion internet")})}
(function(){try{var o=localStorage.getItem("routenette-v");localStorage.setItem("routenette-v",APPV);if(o&&o!==APPV)setTimeout(function(){say("Jeu mis à jour ✓ Ta progression est intacte.")},800)}catch(x){}})();
chkV();setInterval(chkV,30*60000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)chkV()});
function standalone(){try{return matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: fullscreen)").matches||navigator.standalone===true}catch(x){return false}}
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1)}
function inApp(){return /; wv\)|FBAN|FBAV|FB_IAB|Messenger|Instagram|WhatsApp|Snapchat|musical_ly|TikTok|Line\/|GSA\//.test(navigator.userAgent)}
function isAndroid(){return /Android/i.test(navigator.userAgent)}
function isChrome(){var u=navigator.userAgent;return !inApp()&& /Chrome\//.test(u)&&!/EdgA?\/|OPR\/|SamsungBrowser|HuaweiBrowser|HeyTapBrowser|MiuiBrowser|YaBrowser|Firefox|FxiOS|CriOS/.test(u)}
function showIns(force){if(standalone()||document.getElementById("upd").classList.contains("on"))return;
 if(!force){try{if(Date.now()-(+localStorage.getItem("routenette-ins")||0)<3*864e5)return}catch(x){}}
 var m=document.getElementById("insm"),b=document.getElementById("insb");
 if(BIP){m.textContent="Ajoute le jeu sur ton écran d’accueil, en un appui.";b.textContent="Installer";b.style.display=""}
 else if(isAndroid()){m.textContent=isChrome()?"Menu ⋮ → « Installer l’application ». Pas dans le menu ? Ouvre d’abord dans Chrome.":"Ce navigateur ne peut pas installer le jeu : ouvre-le dans Chrome.";b.textContent="Ouvrir dans Chrome";b.style.display=""}
 else if(inApp()){m.textContent="Tu es dans le navigateur d’une messagerie : ouvre le jeu dans Safari pour l’installer.";b.textContent="Copier le lien";b.style.display=""}
 else if(isIOS()){m.textContent="Dans Safari : touche Partager ⬆️ puis « Sur l’écran d’accueil ».";b.style.display="none"}
 else{m.textContent="Ce navigateur ne peut pas l’installer : copie le lien et ouvre-le dans Chrome.";b.textContent="Copier le lien";b.style.display=""}
 document.getElementById("ins").classList.add("on")}
function insLater(){try{localStorage.setItem("routenette-ins",Date.now())}catch(x){}document.getElementById("ins").classList.remove("on")}
function doIns(){if(BIP){var e=BIP;BIP=null;e.prompt();e.userChoice.then(function(c){if(c&&c.outcome==="accepted")document.getElementById("ins").classList.remove("on");else insLater()}).catch(function(){});return}
 var u=location.href.split("#")[0];
 if(isAndroid()){location.href="intent://"+u.replace(/^https?:\/\//,"")+"#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url="+encodeURIComponent(u)+";end";return}
 (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){say("Lien copié ✓ Colle-le dans Chrome")}).catch(function(){prompt("Copie ce lien et ouvre-le dans Chrome :",u)})}
addEventListener("beforeinstallprompt",function(e){BIP=e;if(document.getElementById("splash").style.display!=="none")showIns()});
addEventListener("appinstalled",function(){BIP=null;document.getElementById("ins").classList.remove("on");say("Jeu installé ✓")});
(function(){var p=document.getElementById("insp");if(p&&!standalone())p.style.display=""})();
setTimeout(function(){if(BIP||standalone()||document.getElementById("splash").style.display==="none")return;showIns()},3500);
</script>
