<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d1a14">
<meta name="description" content="Crée ton entreprise d'entretien des routes en Wallonie : petits boulots, machines, ouvriers, puis marchés publics du SPW.">

<title>Route Nette</title>
<style>
:root{
  --bg:#0d1a14;--bg2:#12241b;--card:#18301f;--card2:#1f3b29;--line:#2c4d37;--tx:#f2f7f3;--mut:#a3bcaa;
  --or:#ff9a1f;--or2:#ffb84d;--gr:#4fdc7a;--gr2:#2fb35a;--rd:#ff5d57;--bl:#4fb3ff;--ye:#ffd23f;--vi:#b48cff;
  --sh:0 6px 20px rgba(0,0,0,.35);--r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:600 15px/1.35 Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;max-width:760px;margin:auto;background:linear-gradient(180deg,#0d1a14,#0a140f)}
button{font-family:inherit}
/* --- En-tête --- */
#top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:linear-gradient(180deg,#14281d,#0f2017);border-bottom:1px solid var(--line)}
#logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--or),#ff6a00);display:grid;place-items:center;font-weight:900;color:#2a1600;font-size:15px;box-shadow:0 3px 10px rgba(255,140,0,.35);flex:none}
#tinfo{flex:1;min-width:0}
#tname{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tsub{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cash{background:linear-gradient(135deg,#1f4d2e,#16371f);border:1px solid #2f7a45;border-radius:12px;padding:5px 10px;font-weight:900;font-size:17px;color:#b9ffd0;white-space:nowrap}
#cash.neg{background:linear-gradient(135deg,#5a1f1d,#3b1412);border-color:#9b3a35;color:#ffc2bd}
/* --- Barre de scène --- */
#scene{position:relative}
#cv{width:100%;height:230px;display:block;touch-action:manipulation;background:#7fb8e8}
#hud{position:absolute;left:8px;right:150px;top:8px;flex-direction:column;align-items:flex-start;display:flex;gap:6px;align-items:center;pointer-events:none}
.pill{background:rgba(8,18,13,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:800;white-space:nowrap}
#hudJob{max-width:100%;overflow:hidden;text-overflow:ellipsis}
#speed{position:absolute;right:8px;top:8px;display:flex;gap:4px;background:rgba(8,18,13,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:12px;padding:3px;border:1px solid rgba(255,255,255,.12)}
#speed button{background:none;border:0;color:#fff;font-size:12px;font-weight:900;padding:5px 7px;border-radius:9px;letter-spacing:-2px}
#speed button.on{background:var(--or);color:#2a1600}
#prog{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.4);overflow:hidden;display:none}
#prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gr2),var(--gr));box-shadow:0 0 8px var(--gr)}
/* --- Contenu --- */
#pane{flex:1;overflow-y:auto;padding:12px 12px 24px;-webkit-overflow-scrolling:touch}
.card{background:linear-gradient(180deg,var(--card),#152a1c);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;box-shadow:var(--sh);position:relative;overflow:hidden}
.card.acc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ac,var(--or))}
.card h3{margin:0;font-size:16.5px;font-weight:900;line-height:1.2}
.hd{display:flex;gap:10px;align-items:center}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none;background:var(--ac2,#2b4a35)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px;font-weight:600}
.sm{font-size:12.5px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:4px;background:#24402e;border-radius:8px;padding:3px 8px;font-size:12.5px;font-weight:800}
.tag.g{background:#1d5232;color:#b6f7c9}.tag.r{background:#5b2322;color:#ffc0bb}.tag.o{background:#5c3a0e;color:#ffd79a}.tag.b{background:#173f5e;color:#bfe3ff}.tag.v{background:#3d2c66;color:#dccbff}
.btn{appearance:none;border:0;border-radius:12px;padding:10px 16px;font-weight:900;font-size:15px;color:#2a1600;background:linear-gradient(180deg,var(--or2),var(--or));box-shadow:0 3px 0 #b8630a,0 6px 14px rgba(255,140,0,.25);cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b8630a}
.btn.s{background:linear-gradient(180deg,#2f5139,#264430);color:var(--tx);box-shadow:0 3px 0 #18301f}
.btn.g{background:linear-gradient(180deg,#6cf094,var(--gr2));color:#06230f;box-shadow:0 3px 0 #1d7a3c}
.btn.r{background:linear-gradient(180deg,#ff7f79,var(--rd));color:#fff;box-shadow:0 3px 0 #a3302b}
.btn.w{width:100%}
.btn:disabled{opacity:.42;filter:saturate(.4);box-shadow:none}
.bar{height:10px;background:#0b170f;border-radius:6px;overflow:hidden;margin:8px 0 4px;border:1px solid #23402d}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--gr2),var(--gr));background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.18) 0 8px,transparent 8px 16px),linear-gradient(90deg,var(--gr2),var(--gr));background-size:22px 22px,100% 100%;animation:stripes 1s linear infinite;box-shadow:0 0 10px rgba(79,220,122,.45)}
@keyframes stripes{to{background-position:22px 0,0 0}}
.enter .card,.enter .goal,.enter .kpi,.enter .seg{animation:pop .35s cubic-bezier(.2,.9,.3,1.2) both}
.enter .card:nth-child(2){animation-delay:.03s}.enter .card:nth-child(3){animation-delay:.06s}.enter .card:nth-child(4){animation-delay:.09s}.enter .card:nth-child(5){animation-delay:.12s}.enter .card:nth-child(n+6){animation-delay:.15s}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}}
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite}
.btn.s::after,.btn:disabled::after{display:none}
@keyframes shine{0%,70%{left:-60%}100%{left:130%}}
#cash{transition:transform .2s}
#cash.up{animation:cup .6s}#cash.down{animation:cdown .6s}
@keyframes cup{30%{transform:scale(1.12);box-shadow:0 0 18px rgba(79,220,122,.8)}}
@keyframes cdown{30%{transform:scale(.94);box-shadow:0 0 18px rgba(255,93,87,.7)}}
.fly{position:fixed;z-index:70;font:900 16px Nunito,sans-serif;pointer-events:none;text-shadow:0 2px 6px rgba(0,0,0,.6);animation:fly 1.3s ease-out forwards}
@keyframes fly{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-38px)}}
#logo{position:relative}
#logo::before{content:"";position:absolute;inset:-4px;border-radius:14px;background:conic-gradient(var(--ye) var(--lv,0%),rgba(255,255,255,.12) 0);z-index:-1}
#lvl{position:absolute;bottom:-6px;right:-8px;background:var(--ye);color:#2a1600;border-radius:8px;font-size:9.5px;font-weight:900;padding:0 4px;line-height:14px;border:2px solid #0f2017}
#toast div.good{border-color:var(--gr);box-shadow:0 0 16px rgba(79,220,122,.25)}#toast div.bad{border-color:var(--rd);box-shadow:0 0 16px rgba(255,93,87,.25)}
nav button.on b{animation:bounce .45s}
@keyframes bounce{40%{transform:scale(1.25) translateY(-3px)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
.ic{box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 3px 8px rgba(0,0,0,.25)}
.card{backdrop-filter:blur(2px)}
.money{color:var(--gr);font-weight:900}.neg{color:var(--rd);font-weight:900}
h2{font-size:12.5px;color:var(--mut);margin:16px 4px 8px;text-transform:uppercase;letter-spacing:.08em;font-weight:900}
.req{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:12.5px}
.cv h2{margin:14px 0 6px}
.ph{position:relative;margin:-12px -14px 12px;height:170px;background:#0b170f;overflow:hidden}.ph img{width:100%;height:100%;object-fit:cover;display:block}.ph1{height:auto;padding:10px 14px;color:var(--mut);font-size:12.5px}.ph0{background:linear-gradient(90deg,#132619,#1d3526,#132619);background-size:200% 100%;animation:shim 1.2s linear infinite}@keyframes shim{to{background-position:-200% 0}}
.phx{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.55);color:#fff;border:0;font:700 10.5px Nunito,sans-serif;padding:3px 7px;border-radius:6px}
.phc{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;padding:2px 6px;border-radius:6px;text-decoration:none;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,#3b2a0a,#2a1f0b);border:1px solid #7a5418;border-radius:var(--r);padding:10px 12px;margin-bottom:12px}
.goal b{color:var(--ye)}
.goal .gi{font-size:26px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi div{background:#132619;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.kpi b{display:block;font-size:17px;font-weight:900}
.kpi span{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:6px 2px;border-bottom:1px solid var(--line)}td:last-child{text-align:right;font-weight:800}
/* --- Onglets --- */
nav{display:flex;background:#0b1711;border-top:1px solid var(--line);padding:4px 4px calc(env(safe-area-inset-bottom) + 4px)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:5px 0 4px;font-size:9.5px;font-weight:800;position:relative;min-width:0;border-radius:12px}
nav button b{display:block;font-size:21px;line-height:1.15;filter:grayscale(.5);opacity:.85}
nav button.on{color:var(--or2);background:#1a3022}
nav button.on b{filter:none;opacity:1;transform:scale(1.08)}
nav .bd{position:absolute;top:1px;right:calc(50% - 22px);background:var(--rd);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;font-weight:900;min-width:16px}
/* --- Fenêtres --- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:40;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#modal.on{display:flex}
#modal .box{background:linear-gradient(180deg,#1c3626,#132619);width:100%;max-width:760px;max-height:90dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);border-top:3px solid var(--or);animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
#modal h3{margin:0 0 10px;font-size:20px;font-weight:900}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#203a29;border-radius:20px;padding:7px 11px;margin:3px;font-size:14px;font-weight:800}
.chip.on{background:var(--gr);color:#06230f;border-color:var(--gr)}
input[type=range]{width:100%;accent-color:var(--or);height:28px}
input[type=text],textarea{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:#0b170f;color:var(--tx);font:700 16px Nunito,system-ui,sans-serif}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 112px);transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:4px;width:86%;max-width:480px;pointer-events:none;align-items:center}
#toast div{background:rgba(10,22,15,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,154,31,.7);border-radius:12px;padding:5px 10px;animation:tin .25s;font-size:12.5px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;transition:opacity .4s}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.log div{padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.big{font-size:28px;font-weight:900}
/* --- Accueil --- */
#splash{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;
  background:radial-gradient(120% 80% at 50% 0%,#2f7a45 0%,#163a24 45%,#0b1711 100%)}
#splash h1{margin:0;font-size:46px;font-weight:900;letter-spacing:-.02em;line-height:1;background:linear-gradient(180deg,#fff,#ffd79a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 6px 30px rgba(255,160,40,.25)}
#splash p{margin:0;color:#cfe6d6;font-size:15px;max-width:340px}
#splash .btn{min-width:230px;font-size:18px;padding:14px 20px}
#splash .ver{font-size:12px;color:var(--mut);margin-top:6px}
/* --- Installation et mises à jour --- */
#upd,#ins{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:60;display:none;align-items:center;gap:10px;background:#1c3626;border:1px solid var(--or);color:var(--tx);border-radius:16px;padding:10px 12px;box-shadow:var(--sh);max-width:736px;margin:auto}
#upd.on,#ins.on{display:flex}#upd>div,#ins>div{flex:1}#upd small,#ins small{display:block;font-weight:600;opacity:.85;font-size:13px}
#ins .x{background:transparent;color:var(--tx);border:0;font-size:18px;padding:8px}
.seg{display:flex;gap:4px;background:#0f1f15;border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;background:none;border:0;color:var(--mut);font:800 13px Nunito,sans-serif;padding:8px 4px;border-radius:10px}
.seg button.on{background:var(--card2);color:var(--or2)}
.poste{border-bottom:1px solid var(--line);padding:8px 0}
.poste input{width:92px;padding:7px;border-radius:9px;border:1px solid var(--line);background:#0b170f;color:var(--tx);font:800 15px Nunito,sans-serif;text-align:right}
.mini{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#24402e;color:var(--tx);font:900 18px Nunito,sans-serif}
</style>
</head>
<body>
<header id="top">
  <div id="logo"><span id="lt">RN</span><span id="lvl">1</span></div>
  <div id="tinfo"><div id="tname"></div><div id="tsub"></div></div>
  <div id="cash"></div>
</header>
<div id="scene">
  <canvas id="cv"></canvas>
  <div id="hud"><span class="pill" id="hudJob"></span><span class="pill" id="hudW"></span></div>
  <div id="prog"><i></i></div>
  <div id="speed"><button data-sp="0" aria-label="Pause">❚❚</button><button data-sp="1" aria-label="Vitesse normale">▶</button><button data-sp="2" aria-label="Rapide">▶▶</button><button data-sp="3" aria-label="Très rapide">▶▶▶</button></div>
</div>
<main id="pane"></main>
<nav id="tabs">
  <button data-t="ch"><b>🦺</b>Chantiers</button>

</nav>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<canvas id="fx"></canvas>
<div id="splash">
  <svg width="120" height="120" viewBox="0 0 512 512" aria-hidden="true"><use href="#lg"/></svg>
  <h1>Route Nette</h1>
  <p>Pars de zéro, monte ton entreprise d'entretien des routes et décroche les marchés publics du SPW.</p>
  <button class="btn" id="play">▶ Jouer</button>
  <button class="btn s" id="insp" style="display:none" onclick="showIns(1)">📲 Installer le jeu</button>

</div>
<svg width="0" height="0" style="position:absolute"><defs><g id="lg">
  <defs><linearGradient id="lgb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ec7ff"/><stop offset=".62" stop-color="#bfe9ff"/></linearGradient></defs>
  <rect width="512" height="512" rx="112" fill="url(#lgb)"/>
  <path d="M0 300 Q130 250 256 285 T512 270 V512 H0Z" fill="#5fb845"/>
  <path d="M0 330 L512 330 L512 420 L0 420Z" fill="#3c4148"/>
  <rect x="30" y="371" width="70" height="10" rx="5" fill="#fff"/><rect x="150" y="371" width="70" height="10" rx="5" fill="#fff"/><rect x="270" y="371" width="70" height="10" rx="5" fill="#fff"/><rect x="390" y="371" width="70" height="10" rx="5" fill="#fff"/>
  <path d="M0 420 H512 V512 H0Z" fill="#4fa83c"/>
  <path d="M256 120 L320 330 H192Z" fill="#ff7a00"/><path d="M234 192 H278 L288 225 H224Z" fill="#fff"/><path d="M213 262 H299 L309 295 H203Z" fill="#fff"/>

</g></defs></svg>

<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const eur=n=>(n<0?'-':'')+Math.round(Math.abs(n)).toLocaleString('fr-BE')+' €';
const eur2=n=>n.toLocaleString('fr-BE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const nb=n=>Math.round(n).toLocaleString('fr-BE');
const nb1=n=>(+n).toLocaleString('fr-BE',{maximumFractionDigits:1});
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const WDM=21.7; // jours ouvrables par mois

/* =====================================================================
   DONNÉES — prix HTVA relevés sur le marché belge (annonces d'occasion 2025-2026,
   barèmes CP 124, salaires moyens). Voir CLAUDE.md pour les sources.
   ===================================================================== */
// p = prix d'achat HTVA ; u = carburant + entretien par jour de chantier ; veh = véhicule (l = léger, h = poids lourd)
const EQ={
  taillehaie:{n:'Taille-haie thermique pro',ic:'✂️',p:620,u:5},
  souffleur:{n:'Souffleur à dos pro',ic:'🍃',p:690,u:5},
  debrou:{n:'Débroussailleuse pro (type FS 461)',ic:'🪚',p:1150,u:8},
  tondeuse:{n:'Tondeuse pro tractée',ic:'🌱',p:1290,u:6},
  remorque:{n:'Remorque 750 kg',ic:'🛒',p:1450,u:3},
  signal:{n:'Signalisation de chantier (panneaux, cônes, barrières)',ic:'🚧',p:2400,u:3},
  karcher:{n:'Nettoyeur haute pression eau chaude',ic:'💦',p:4300,u:29},
  fleche:{n:'Remorque flèche lumineuse (FLR)',ic:'⚠️',p:12500,u:6,veh:'l'},
  broyeur:{n:'Broyeur de branches tractable',ic:'🪵',p:13900,u:39},
  van:{n:'Camionnette plateau Transit (occasion 2019)',ic:'🚐',p:22500,u:36,veh:'l'},

function hireRole(r){const R0=ROLES[r];if(!st.adm.bce)return;if(!R0.multi&&has(r))return;if(R0.need&&ownW()<R0.need)return toastMsg(`Il faut au moins ${R0.need} personnes dans l'entreprise.`);
  const day=R0.day;if(st.cash<day*WDM)return toastMsg(`Il faut pouvoir payer un mois de salaire (${eur(day*WDM)}).`);
  const n=nextName(r);
  st.workers.push({id:st.nid++,n,r,sk:1,day,pc:0,skin:RI(0,SKIN.length-1),base:1,mot:1,hd:st.day,warn:0});log(`${R0.ic} ${n} rejoint ${esc(st.name)} : ${R0.n}.`);kaching();goals();save();render()}
function fire(id){const w=st.workers.find(x=>x.id===id);if(!w||w.boss)return;const onC=st.contracts.find(c=>c.st==='run'&&c.crew.includes(id));if(onC&&!confirm(`${w.n} travaille sur « ${JOBS[onC.j].n} ». Si l'équipe devient trop petite, ce chantier sera mis en pause. Continuer ?`))return;

const MORT_RATE=.033,MORT_Y=25;
// Salaire du patron : net choisi par le joueur. Indépendant = prélèvement (le bénéfice est déjà taxé) ;
// SRL = rémunération de dirigeant, coût brut ≈ net / 0,55 (IPP + cotisations sociales), déductible pour la société.
const patSal=()=>{const V=pv();if(V.sal===undefined)V.sal=1800;return V.sal};
const patronCost=()=>st.adm&&st.adm.bce?Math.round(st.srl?patSal()/.55:patSal()):0;
function paySalary(){if(!st.adm.bce)return;const net=patSal();if(!net)return;const cost=patronCost();const V=pv();
  const room=st.cash+overdraft();if(room<cost){log(`⚠️ La société n'a pas pu te verser ton salaire (${eur(net)}) : le compte est trop bas.`);return}
  mv(-cost,st.srl?'Rémunération du dirigeant (toi)':'Ton salaire (prélèvement)',st.srl?'sal':'priv');if(!st.srl)st.mCapex+=cost;V.cash+=net;V.tr=(V.tr||0)+net;log(`💶 Ton salaire de ${eur(net)} est versé sur ton compte privé.`,false)}
function setSal(v){pv().sal=Math.max(0,Math.round(v/50)*50);click();save();render()}
const pv=()=>st.priv||(st.priv={cash:0,own:[],tr:0});
const ownsHome=()=>pv().own.some(o=>PRIV[o.k]&&PRIV[o.k].home);
function pValue(o){const P=PRIV[o.k],y=(st.day-o.day)/365;if(!P||P.c==='exp'||P.once||P.keep||P.sub)return 0;let v=o.price*Math.pow(1-P.dep,y);if(P.c==='car'&&!o.used)v*=.85;return Math.round(v)}
function buyFees(k,loan){const P=PRIV[k];if(P.c==='loc')return Math.round(P.p*.125)+Math.round(2500+P.p*.01);if(P.c==='home'){const first=P.home&&!ownsHome();return Math.round(P.p*(first?.03:.125))+Math.round(2500+P.p*.01)}return P.tmc||0}
function mortPay(capital){const r=MORT_RATE/12,n=MORT_Y*12;return capital*r/(1-Math.pow(1+r,-n))}
function privMonthly(){let t=0;for(const o of pv().own){const P=PRIV[o.k];if(P&&P.m)t+=P.m;if(o.loan)t+=o.pay}return Math.round(t)}
function pBuy(k,loan){const P=PRIV[k],V=pv();if(P.needHome&&!ownsHome())return toastMsg('Il te faut d’abord une maison.');
  const fee=buyFees(k),need=loan?Math.round(P.p*.2)+fee:P.p+fee;
  if(V.cash<need)return toastMsg(`Il te faut ${eur(need)} sur ton compte privé (tu as ${eur(V.cash)}).${loan?'':' Pour une maison, tu peux aussi prendre un crédit hypothécaire.'}`);
  if(!confirm(`${P.n}\nPrix : ${eur(P.p)}${fee?`\n${P.c==='home'?'Droits d’enregistrement + notaire':'Taxe de mise en circulation'} : ${eur(fee)}`:''}${loan?`\nApport (20 %) : ${eur(P.p*.2)}\nCrédit hypothécaire : ${eur(P.p*.8)} sur ${MORT_Y} ans à ${(MORT_RATE*100).toFixed(1)} % → ${eur(mortPay(P.p*.8))}/mois`:''}${P.m?`\nCoûts chaque mois : ${eur(P.m)}`:''}\n\nConfirmer l’achat ?`))return;
  V.cash-=need;if(P.c!=='exp'&&!P.once){const o={id:st.nid++,k,day:st.day,price:P.p,used:P.c==='occ'};if(loan){o.loan=Math.round(P.p*.8);o.pay=Math.round(mortPay(P.p*.8))}V.own.push(o)}
  log(`${P.ic} ${P.c==='exp'?'Profite bien : ':'Achat : '}${P.n}${loan?' (avec crédit hypothécaire)':''}.`);confetti(P.p>100000?180:80);snd(880,.1,'triangle',.06);save();render()}
function pSell(id){const V=pv(),o=V.own.find(x=>x.id===id);if(!o)return;const P0=PRIV[o.k];if(P0.sub){if(!confirm(`Résilier : ${P0.n} ?`))return;V.own.splice(V.own.indexOf(o),1);log(`✂️ Résilié : ${P0.n}.`,false);save();render();return}if(P0.keep)return;const P=PRIV[o.k],v=pValue(o),fee=P.c==='home'?Math.round(v*.03):0,net=v-fee-(o.loan||0);
  if(!confirm(`Vendre ${P.n} ?\nValeur aujourd’hui : ${eur(v)}${fee?`\nFrais d’agence (± 3 %) : ${eur(fee)}`:''}${o.loan?`\nRemboursement du crédit restant : ${eur(o.loan)}`:''}\nTu reçois : ${eur(net)}`))return;
  V.own.splice(V.own.indexOf(o),1);V.cash+=net;log(`💰 Vendu : ${P.n} (${eur(net)}).`);save();render()}
function pTransfer(a,kind){a=Math.round(a);if(a<=0||st.cash<a)return toastMsg('Pas assez d’argent sur le compte de la société.');const V=pv();let net=a,lbl='';
  if(!st.srl){lbl='Prélèvement privé (bénéfice déjà taxé)';}
  else if(kind==='div'){net=Math.round(a*.7);lbl='Dividende (précompte mobilier 30 %)'}
  else{net=Math.round(a*.55);lbl='Rémunération de dirigeant (IPP + cotisations ± 45 %)'}
  const ded=st.srl&&kind!=='div';mv(-a,lbl,ded?'sal':'priv');if(!ded)st.mCapex+=a;V.cash+=net;V.tr+=net;log(`🏦 ${eur(net)} versés sur ton compte privé (${lbl}).`,false);save();render()}
// chaque 1er du mois : coûts de la vie privée et remboursements de crédit
function privMonth(){const V=pv();let t=ownsHome()?850:1650;privInvest();for(const o of [...V.own]){const P=PRIV[o.k];if(!P)continue;t+=P.m||0;if(o.loan){const it=o.loan*MORT_RATE/12;t+=o.pay;o.loan=Math.max(0,Math.round(o.loan-(o.pay-it)));if(!o.loan){delete o.pay;log(`🏠 Crédit hypothécaire remboursé : ${P.n} est entièrement à toi !`)}}}
  if(V.cash<0)t+=Math.round(-V.cash*.09/12);V.cash-=t;if(t)log(`🏡 Vie privée (${ownsHome()?'courses, énergie, voiture':'loyer, courses, énergie, voiture'}${V.own.length?', tes biens':''}${V.own.some(o=>o.loan)?', crédit':''}) : -${eur(t)}`,false);

async function loadImg(k){if(imgBusy[k])return;imgBusy[k]=1;let net=0;
  for(const t of IMG[k]||[]){const i=t.indexOf(':'),l=t.slice(0,i),ti=t.slice(i+1);

      const r=await fetch(u);net=1;if(!r.ok)continue;const j=await r.json();const pg=j.query&&j.query.pages&&Object.values(j.query.pages)[0];
      if(pg&&pg.thumbnail&&pg.thumbnail.source){IMC[k]={src:pg.thumbnail.source,page:pg.fullurl||`https://${l}.wikipedia.org/wiki/${encodeURIComponent(ti)}`,title:pg.title};break}}catch(e){}}
  if(!IMC[k]){if(!net){imgFail[k]=Date.now();delete imgBusy[k];render();return}IMC[k]={none:1,t:Date.now()}}
  try{localStorage.setItem('rn-img3',JSON.stringify(IMC))}catch(e){}
