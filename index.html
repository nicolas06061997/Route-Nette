<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d1a14">
<meta name="description" content="Crée ton entreprise d'entretien des routes en Wallonie : petits boulots, machines, ouvriers, puis marchés publics du SPW.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Route Nette">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<title>Route Nette</title>
<style>
:root{
  --bg:#0d1a14;--bg2:#12241b;--card:#18301f;--card2:#1f3b29;--line:#2c4d37;--tx:#f2f7f3;--mut:#a3bcaa;
  --or:#ff9a1f;--or2:#ffb84d;--gr:#4fdc7a;--gr2:#2fb35a;--rd:#ff5d57;--bl:#4fb3ff;--ye:#ffd23f;--vi:#b48cff;
  --sh:0 6px 20px rgba(0,0,0,.35);--r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:600 15px/1.35 Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;max-width:760px;margin:auto;background:linear-gradient(180deg,#0d1a14,#0a140f)}
button{font-family:inherit}
/* --- En-tête --- */
#top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:linear-gradient(180deg,#14281d,#0f2017);border-bottom:1px solid var(--line)}
#logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--or),#ff6a00);display:grid;place-items:center;font-weight:900;color:#2a1600;font-size:15px;box-shadow:0 3px 10px rgba(255,140,0,.35);flex:none}
#tinfo{flex:1;min-width:0}
#tname{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tsub{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cash{background:linear-gradient(135deg,#1f4d2e,#16371f);border:1px solid #2f7a45;border-radius:12px;padding:5px 10px;font-weight:900;font-size:17px;color:#b9ffd0;white-space:nowrap}
#cash.neg{background:linear-gradient(135deg,#5a1f1d,#3b1412);border-color:#9b3a35;color:#ffc2bd}
/* --- Barre de scène --- */
#scene{position:relative}
#cv{width:100%;height:230px;display:block;touch-action:manipulation;background:#7fb8e8}
#hud{position:absolute;left:8px;right:150px;top:8px;flex-direction:column;align-items:flex-start;display:flex;gap:6px;align-items:center;pointer-events:none}
.pill{background:rgba(8,18,13,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:800;white-space:nowrap}
#hudJob{max-width:100%;overflow:hidden;text-overflow:ellipsis}
#speed{position:absolute;right:8px;top:8px;display:flex;gap:4px;background:rgba(8,18,13,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:12px;padding:3px;border:1px solid rgba(255,255,255,.12)}
#speed button{background:none;border:0;color:#fff;font-size:12px;font-weight:900;padding:5px 7px;border-radius:9px;letter-spacing:-2px}
#speed button.on{background:var(--or);color:#2a1600}
#prog{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.4);overflow:hidden;display:none}
#prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gr2),var(--gr));box-shadow:0 0 8px var(--gr)}
/* --- Contenu --- */
#pane{flex:1;overflow-y:auto;padding:12px 12px 24px;-webkit-overflow-scrolling:touch}
.card{background:linear-gradient(180deg,var(--card),#152a1c);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;box-shadow:var(--sh);position:relative;overflow:hidden}
.card.acc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ac,var(--or))}
.card h3{margin:0;font-size:16.5px;font-weight:900;line-height:1.2}
.hd{display:flex;gap:10px;align-items:center}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none;background:var(--ac2,#2b4a35)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px;font-weight:600}
.sm{font-size:12.5px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:4px;background:#24402e;border-radius:8px;padding:3px 8px;font-size:12.5px;font-weight:800}
.tag.g{background:#1d5232;color:#b6f7c9}.tag.r{background:#5b2322;color:#ffc0bb}.tag.o{background:#5c3a0e;color:#ffd79a}.tag.b{background:#173f5e;color:#bfe3ff}.tag.v{background:#3d2c66;color:#dccbff}
.btn{appearance:none;border:0;border-radius:12px;padding:10px 16px;font-weight:900;font-size:15px;color:#2a1600;background:linear-gradient(180deg,var(--or2),var(--or));box-shadow:0 3px 0 #b8630a,0 6px 14px rgba(255,140,0,.25);cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b8630a}
.btn.s{background:linear-gradient(180deg,#2f5139,#264430);color:var(--tx);box-shadow:0 3px 0 #18301f}
.btn.g{background:linear-gradient(180deg,#6cf094,var(--gr2));color:#06230f;box-shadow:0 3px 0 #1d7a3c}
.btn.r{background:linear-gradient(180deg,#ff7f79,var(--rd));color:#fff;box-shadow:0 3px 0 #a3302b}
.btn.w{width:100%}
.btn:disabled{opacity:.42;filter:saturate(.4);box-shadow:none}
.bar{height:10px;background:#0b170f;border-radius:6px;overflow:hidden;margin:8px 0 4px;border:1px solid #23402d}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--gr2),var(--gr));background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.18) 0 8px,transparent 8px 16px),linear-gradient(90deg,var(--gr2),var(--gr));background-size:22px 22px,100% 100%;animation:stripes 1s linear infinite;box-shadow:0 0 10px rgba(79,220,122,.45)}
@keyframes stripes{to{background-position:22px 0,0 0}}
.enter .card,.enter .goal,.enter .kpi,.enter .seg{animation:pop .35s cubic-bezier(.2,.9,.3,1.2) both}
.enter .card:nth-child(2){animation-delay:.03s}.enter .card:nth-child(3){animation-delay:.06s}.enter .card:nth-child(4){animation-delay:.09s}.enter .card:nth-child(5){animation-delay:.12s}.enter .card:nth-child(n+6){animation-delay:.15s}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}}
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite}
.btn.s::after,.btn:disabled::after{display:none}
@keyframes shine{0%,70%{left:-60%}100%{left:130%}}
#cash{transition:transform .2s}
#cash.up{animation:cup .6s}#cash.down{animation:cdown .6s}
@keyframes cup{30%{transform:scale(1.12);box-shadow:0 0 18px rgba(79,220,122,.8)}}
@keyframes cdown{30%{transform:scale(.94);box-shadow:0 0 18px rgba(255,93,87,.7)}}
.pvmode .fly{display:none}
.fly{position:fixed;z-index:70;font:900 16px Nunito,sans-serif;pointer-events:none;text-shadow:0 2px 6px rgba(0,0,0,.6);animation:fly 1.3s ease-out forwards}
@keyframes fly{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-38px)}}
#logo{position:relative}
#logo::before{content:"";position:absolute;inset:-4px;border-radius:14px;background:conic-gradient(var(--ye) var(--lv,0%),rgba(255,255,255,.12) 0);z-index:-1}
#lvl{position:absolute;bottom:-6px;right:-8px;background:var(--ye);color:#2a1600;border-radius:8px;font-size:9.5px;font-weight:900;padding:0 4px;line-height:14px;border:2px solid #0f2017}
#toast div.good{border-color:var(--gr);box-shadow:0 0 16px rgba(79,220,122,.25)}#toast div.bad{border-color:var(--rd);box-shadow:0 0 16px rgba(255,93,87,.25)}
nav button.on b{animation:bounce .45s}
@keyframes bounce{40%{transform:scale(1.25) translateY(-3px)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
.ic{box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 3px 8px rgba(0,0,0,.25)}
.money{color:var(--gr);font-weight:900}.neg{color:var(--rd);font-weight:900}
h2{font-size:12.5px;color:var(--mut);margin:16px 4px 8px;text-transform:uppercase;letter-spacing:.08em;font-weight:900}
.req{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:12.5px}
.cv h2{margin:14px 0 6px}
.ph{position:relative;margin:-12px -14px 12px;height:170px;background:#0b170f;overflow:hidden}.ph img{width:100%;height:100%;object-fit:cover;display:block}.ph1{height:auto;padding:10px 14px;color:var(--mut);font-size:12.5px}.ph0{background:linear-gradient(90deg,#132619,#1d3526,#132619);background-size:200% 100%;animation:shim 1.2s linear infinite}@keyframes shim{to{background-position:-200% 0}}
.phx{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.55);color:#fff;border:0;font:700 10.5px Nunito,sans-serif;padding:3px 7px;border-radius:6px}
.phc{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;padding:2px 6px;border-radius:6px;text-decoration:none;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,#3b2a0a,#2a1f0b);border:1px solid #7a5418;border-radius:var(--r);padding:10px 12px;margin-bottom:12px}
.goal b{color:var(--ye)}
.goal .gi{font-size:26px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi div{background:#132619;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.kpi b{display:block;font-size:17px;font-weight:900}
.kpi span{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:6px 2px;border-bottom:1px solid var(--line)}td:last-child{text-align:right;font-weight:800}
/* --- Onglets --- */
nav{display:flex;background:#0b1711;border-top:1px solid var(--line);padding:4px 4px calc(env(safe-area-inset-bottom) + 4px)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:5px 0 4px;font-size:9.5px;font-weight:800;position:relative;min-width:0;border-radius:12px}
nav button b{display:block;font-size:21px;line-height:1.15;filter:grayscale(.5);opacity:.85}
nav button.on{color:var(--or2);background:#1a3022}
nav button.on b{filter:none;opacity:1;transform:scale(1.08)}
nav .bd{position:absolute;top:1px;right:calc(50% - 22px);background:var(--rd);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;font-weight:900;min-width:16px}
/* --- Vie privée : une page à part, son propre monde --- */
#priv{position:fixed;top:0;bottom:0;left:0;right:0;max-width:760px;margin:auto;z-index:30;display:none;flex-direction:column;background:linear-gradient(180deg,#1d1631,#120d20)}
#priv.on{display:flex;animation:pvin .28s ease-out}@keyframes pvin{from{opacity:0;transform:translateY(16px)}}
#phead{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:linear-gradient(180deg,#2c2150,#1e1636);border-bottom:1px solid #ffffff1a}
.pback{background:#ffffff14;border:1px solid #ffffff26;color:var(--tx);border-radius:12px;padding:7px 9px;font:800 12.5px Nunito,sans-serif;white-space:nowrap}
#pcash{background:linear-gradient(180deg,#3a2b66,#2a1f4a);border:1px solid #b48cff66;border-radius:14px;padding:6px 9px;font-weight:900;font-size:15.5px;color:#e2d4ff;white-space:nowrap}
#ppane{flex:1;overflow-y:auto;padding:12px 12px 24px;-webkit-overflow-scrolling:touch}
#ptabs{background:#140f22;border-top:1px solid #ffffff1a}#ptabs button.on{background:#2c2150;color:#ffc46b}
#pscene{position:relative;height:178px;overflow:hidden;flex:none;border-bottom:1px solid #ffffff14}
#pscene>div{position:absolute}.ps-sky{inset:0}.ps-sun{right:22px;top:14px;font-size:34px;filter:drop-shadow(0 0 14px #fff6)}
.ps-cl{left:-60px;font-size:30px;opacity:.9;animation:pscl linear infinite}@keyframes pscl{to{transform:translateX(900px)}}
.ps-air{left:-70px;font-size:26px;animation:psair 22s linear infinite}@keyframes psair{0%{transform:translate(0,10px)}100%{transform:translate(950px,-20px)}}
.ps-hill{left:-10%;right:-10%;bottom:42px;height:90px;border-radius:50% 50% 0 0/100% 100% 0 0;opacity:.9}
.ps-far{left:0;right:0;bottom:92px;text-align:center;font-size:22px;letter-spacing:14px;opacity:.95}
.ps-lake{right:6%;bottom:30px;width:42%;height:26px;border-radius:50%;background:linear-gradient(180deg,#4fb3ff,#2a7fc9);display:flex;justify-content:space-around;align-items:flex-end;font-size:22px}.ps-lake span{animation:psb 3s ease-in-out infinite;margin-bottom:6px}@keyframes psb{50%{transform:translateY(-3px)}}
.ps-ground{left:0;right:0;bottom:0;height:46px}
.ps-home{left:8%;bottom:20px;font-size:84px;line-height:1;filter:drop-shadow(0 6px 6px #0006)}
.ps-pool{left:35%;bottom:8px;font-size:26px;background:#4fb3ff;border-radius:10px;padding:0 6px}
.ps-fam{left:36%;bottom:34px;font-size:24px;letter-spacing:1px}
.ps-cars{left:4%;right:4%;bottom:2px;text-align:right;font-size:28px;letter-spacing:2px;white-space:nowrap;overflow:hidden}
.ps-tag{left:10px;top:10px;background:#0008;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;color:#fff}
/* --- Fenêtres --- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;z-index:40;}
#modal.on{display:flex}
#modal .box{background:linear-gradient(180deg,#1c3626,#132619);width:100%;max-width:760px;max-height:90dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;transform:translateZ(0);border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);border-top:3px solid var(--or);animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
#modal h3{margin:0 0 10px;font-size:20px;font-weight:900}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#203a29;border-radius:20px;padding:7px 11px;margin:3px;font-size:14px;font-weight:800}
.chip.on{background:var(--gr);color:#06230f;border-color:var(--gr)}
input[type=range]{width:100%;accent-color:var(--or);height:28px}
input[type=text],textarea{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:#0b170f;color:var(--tx);font:700 16px Nunito,system-ui,sans-serif}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 112px);transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:4px;width:86%;max-width:480px;pointer-events:none;align-items:center}
#toast div{background:rgba(10,22,15,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,154,31,.7);border-radius:12px;padding:5px 10px;animation:tin .25s;font-size:12.5px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;transition:opacity .4s}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.log div{padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.big{font-size:28px;font-weight:900}
/* --- Accueil --- */
#splash{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;
  background:radial-gradient(120% 80% at 50% 0%,#2f7a45 0%,#163a24 45%,#0b1711 100%)}
#splash h1{margin:0;font-size:46px;font-weight:900;letter-spacing:-.02em;line-height:1;background:linear-gradient(180deg,#fff,#ffd79a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 6px 30px rgba(255,160,40,.25)}
#splash p{margin:0;color:#cfe6d6;font-size:15px;max-width:340px}
#splash .btn{min-width:230px;font-size:18px;padding:14px 20px}
#splash .ver{font-size:12px;color:var(--mut);margin-top:6px}
/* --- Installation et mises à jour --- */
#upd,#ins{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:60;display:none;align-items:center;gap:10px;background:#1c3626;border:1px solid var(--or);color:var(--tx);border-radius:16px;padding:10px 12px;box-shadow:var(--sh);max-width:736px;margin:auto}
#upd.on,#ins.on{display:flex}#upd>div,#ins>div{flex:1}#upd small,#ins small{display:block;font-weight:600;opacity:.85;font-size:13px}
#ins .x{background:transparent;color:var(--tx);border:0;font-size:18px;padding:8px}
.pvh{background:linear-gradient(160deg,#2c2552 0%,#1b3a2b 100%)}.pvhome{font-size:52px;line-height:1;margin-right:12px;animation:pvb 3s ease-in-out infinite;filter:drop-shadow(0 4px 6px #0006)}@keyframes pvb{50%{transform:translateY(-4px)}}
.pvbar,.pvbud{height:8px;border-radius:6px;background:#0f1f15;margin:10px 0 4px;overflow:hidden}.pvbar i,.pvbud i{display:block;height:100%;background:linear-gradient(90deg,var(--or),var(--or2));border-radius:6px}
.pvrow{display:flex;align-items:center;gap:10px;margin-top:8px;padding-top:8px;border-top:1px solid #ffffff14}.pvrow span{font-size:12px;font-weight:800;color:var(--mut);width:58px;flex:none}.emo{font-size:24px;letter-spacing:2px;line-height:1.25;word-break:break-all}
.pvev{padding:5px 0;border-bottom:1px solid #ffffff10}.pvev:last-child{border:0}.pvo{padding-top:12px;padding-bottom:12px}
.ask h3{font-size:19px;line-height:1.2}.askh{display:flex;align-items:center;gap:12px;margin-bottom:10px}.askic{font-size:40px;line-height:1;flex:none}.askr{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #ffffff14;font-size:14px}.askr span{color:var(--mut)}.askr b{text-align:right}.askp{font-size:14px;color:var(--mut);margin:8px 0 0;line-height:1.4}.askw{background:#5c3a0e;color:#ffd79a;border-radius:10px;padding:9px 11px;margin-top:10px;font-size:13.5px;font-weight:700;line-height:1.35}.ask .ph,.ask img{border-radius:12px;margin-bottom:10px}.ask img{max-height:190px;width:100%;object-fit:cover}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.chips button{background:#0f1f15;border:1px solid var(--line);color:var(--mut);font:800 13px Nunito,sans-serif;padding:7px 11px;border-radius:999px}.chips button.on{background:var(--card2);color:var(--or2);border-color:var(--or)}
.seg{display:flex;gap:4px;background:#0f1f15;border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;background:none;border:0;color:var(--mut);font:800 13px Nunito,sans-serif;padding:8px 4px;border-radius:10px}
.seg button.on{background:var(--card2);color:var(--or2)}
.poste{border-bottom:1px solid var(--line);padding:8px 0}
.poste input{width:92px;padding:7px;border-radius:9px;border:1px solid var(--line);background:#0b170f;color:var(--tx);font:800 15px Nunito,sans-serif;text-align:right}
.mini{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#24402e;color:var(--tx);font:900 18px Nunito,sans-serif}
</style>
</head>
<body>
<header id="top">
  <div id="logo" onclick="if(st&&st.adm.bce){click();careerUI()}" style="cursor:pointer"><span id="lt">RN</span><span id="lvl">1</span></div>
  <div id="tinfo"><div id="tname"></div><div id="tsub"></div></div>
  <div id="cash"></div>
</header>
<div id="scene">
  <canvas id="cv"></canvas>
  <div id="hud"><span class="pill" id="hudJob"></span><span class="pill" id="hudW"></span></div>
  <div id="prog"><i></i></div>
  <div id="speed"><button data-sp="0" aria-label="Pause">❚❚</button><button data-sp="1" aria-label="Vitesse normale">▶</button><button data-sp="2" aria-label="Rapide">▶▶</button><button data-sp="3" aria-label="Très rapide">▶▶▶</button></div>
</div>
<main id="pane"></main>

  showModal(h+`<button class="btn s w" onclick="closeM()">Fermer</button>`)}
function siteCard(){const k=siteK(),S=SITES[k],n=vehCount(),cap=siteCap(),ov=Math.max(0,n-cap),X=xs(),AL=siteAlloc();

  ${k==='home'&&!X.length?`<button class="btn s" style="margin-top:10px" onclick="click();siteUI('move')">🏭 Louer ou acheter un entrepôt</button>`:`<div class="row" style="margin-top:10px"><button class="btn ${AL.out?'':'s'}" onclick="click();siteUI('add')">➕ Ajouter un dépôt${AL.out?` (${AL.out} dehors)`:''}</button><button class="btn s" onclick="click();siteUI('move')">🔁 Déménager</button></div>`}</div>`}
/* ---------- Filiales en Europe ----------
   Coûts estimés d'une implantation réelle (création de société, avocat, capital, dépôt, machines, recrutement, directeur local) ;
   impôt des sociétés de chaque pays (2025) ; dividendes vers la Belgique exonérés (directive mère-filiale + RDT/DBI 100 %).
   pot = chiffre d'affaires mensuel à pleine vitesse (niveau 1), var = part des coûts variables (salaires, carburant), fix = frais fixes/mois. */
const EU={
  fr:{n:'France (Hauts-de-France)',f:'🇫🇷',tax:.25,setup:450000,fix:32000,pot:160000,var:.72,d:'Marché énorme et proche, même langue. Les charges sociales françaises sont parmi les plus élevées d’Europe.'},
  lu:{n:'Luxembourg',f:'🇱🇺',tax:.2387,setup:380000,fix:36000,pot:150000,var:.70,d:'Tout près, communes riches qui paient bien, mais salaires minimums très élevés.'},
  nl:{n:'Pays-Bas',f:'🇳🇱',tax:.258,setup:520000,fix:40000,pot:190000,var:.71,d:'Gros budgets d’entretien des routes (Rijkswaterstaat), mais concurrence très forte.'},
  de:{n:'Allemagne (Rhénanie-du-Nord)',f:'🇩🇪',tax:.30,setup:650000,fix:48000,pot:240000,var:.72,d:'Le plus grand marché, mais l’allemand est obligatoire et l’impôt est à ± 30 %.'},
  es:{n:'Espagne',f:'🇪🇸',tax:.25,setup:400000,fix:26000,pot:120000,var:.74,d:'Moins cher, mais loin : difficile à surveiller depuis la Belgique.'},
  pl:{n:'Pologne',f:'🇵🇱',tax:.19,setup:320000,fix:18000,pot:95000,var:.70,d:'Main-d’œuvre moins chère et impôt à 19 %, mais petits contrats.'}};
const fil=()=>st.fil||(st.fil={});
function euReq(){return[[st.srl,'Être une SRL (société)'],[caRecent()>=1500000,`Chiffre d’affaires d’au moins 1 500 000 € sur un an (${eur(caRecent())})`],[st.rep>=60,`Réputation d’au moins 60 (${st.rep})`],[has('daf'),'Un directeur administratif et financier (DAF)']]}
function euOpen(k,ok){const C=EU[k];if(fil()[k])return;if(!euReq().every(x=>x[0]))return toastMsg('Conditions pas encore remplies.');
  if(st.cash<C.setup)return toastMsg(`Il faut ${eur(C.setup)} sur le compte de la société.`);
  if(!ok)return ask(`Créer une filiale : ${C.n} ?\nInvestissement de départ : ${eur(C.setup)}\nFrais fixes : ${eur(C.fix)}/mois\nImpôt des sociétés : ${(C.tax*100).toFixed(C.tax*100%1?2:0).replace('.',',')} %\nPleine vitesse : après ± 18 mois\nAvocat, notaire, capital, dépôt, machines, recrutement et directeur local. Les premiers mois, la filiale perd de l’argent : la société belge comble les pertes.\n⚠️ Rien n’est garanti : une filiale mal partie peut coûter très cher.`,()=>euOpen(k,1),{ic:C.f,ok:'Créer la filiale',danger:1});
  mv(-C.setup,'Création de la filiale '+C.n,'buy');st.mCapex+=C.setup;fil()[k]={d:st.day,lv:1,inv:C.setup,cash:Math.round(C.setup*.12),m:0,last:null,hist:[],div:0,tot:0};
  log(`${C.f} Ta filiale ${C.n} est créée ! Le directeur local recrute ses premières équipes.`);confetti(200);kaching();save();closeM();render()}
function euMonth(){for(const k in fil()){const F=fil()[k],C=EU[k];F.m++;const L=F.lv,pot=C.pot*(L===1?1:L===2?1.7:2.5),fix=C.fix*(L===1?1:L===2?1.45:2),ramp=Math.max(.08,Math.min(1,(F.m-1)/17));
    const mo=month(),sea=mo===12||mo<=2?.7:mo>=4&&mo<=9?1.12:1;let ev='';let rv=pot*ramp*sea*R(.8,1.2);
    const r=Math.random();if(F.m>3&&r<.06){rv*=1.35;ev=pick(['gros contrat gagné auprès d’une région','nouveau client : une autoroute privée','contrat d’urgence après des tempêtes'])}else if(F.m>3&&r<.12){rv*=.65;ev=pick(['grève dans le secteur','un gros client paie en retard','chantier perdu face à un concurrent local'])}
    rv=Math.round(rv);const ebt=Math.round(rv*(1-C.var)-fix),tax=ebt>0?Math.round(ebt*C.tax):0,net=ebt-tax;F.cash+=net;F.tot+=net;F.last={rv,ebt,tax,net,ev};F.hist.push(net);if(F.hist.length>12)F.hist.shift();
    if(ev)log(`${C.f} Filiale ${C.n} : ${ev}.`,false);
    if(F.cash<0){const inj=-F.cash+Math.round(fix*.5);mv(-inj,'Apport en capital : filiale '+C.n,'buy');st.mCapex+=inj;F.inv+=inj;F.cash+=inj;log(`${C.f} La filiale ${C.n} manque d’argent : la société belge lui verse ${eur(inj)}.`,false)}}}
function euDiv(k){const F=fil()[k],C=EU[k];const a=Math.round(F.cash-EU[k].fix*.5);click();if(a<1000)return toastMsg('La filiale doit garder de quoi payer ses frais du mois.');
  F.cash-=a;F.div+=a;mv(a,'Dividende de la filiale '+C.n+' (exonéré : RDT)','in');st.mCapex-=a;log(`${C.f} Dividende rapatrié de ${C.n} : +${eur(a)} (pas d’impôt en plus : directive mère-filiale).`);kaching();save();render()}
function euUp(k,ok){const F=fil()[k],C=EU[k];if(F.lv>=3)return;if(F.m<18)return toastMsg(`Attends que la filiale tourne à plein (démarrage 100 %, encore ${18-F.m} mois) avant de l’agrandir.`);const c=Math.round(C.setup*.7*F.lv);if(st.cash<c)return toastMsg(`Il faut ${eur(c)} sur le compte de la société.`);
  if(!ok)return ask(`Agrandir la filiale ${C.n} ?\nInvestissement : ${eur(c)}\nNiveau : ${F.lv} → ${F.lv+1}\nChiffre d’affaires possible : ×${F.lv===1?'1,7':'2,5 (au lieu de 1,7)'}\nNouveaux frais fixes : ${eur(C.fix*(F.lv===1?1.45:2))}/mois\nUn 2e dépôt, plus de machines et une nouvelle équipe dans le pays.`,()=>euUp(k,1),{ic:C.f,ok:'Agrandir'});
  mv(-c,`Agrandissement de la filiale ${C.n}`,'buy');st.mCapex+=c;F.inv+=c;F.lv++;log(`${C.f} La filiale ${C.n} passe au niveau ${F.lv} !`);confetti(150);save();render()}
function euVal(k){const F=fil()[k],y=F.hist.reduce((a,b)=>a+b,0)*(12/Math.max(1,F.hist.length));return Math.max(Math.round(F.inv*.25),Math.round(y*5))+Math.max(0,F.cash)}
function euSell(k,ok){const F=fil()[k],C=EU[k],v=euVal(k);
  if(!ok)return ask(`Vendre la filiale ${C.n} ?\nDéjà investi : ${eur(F.inv)}\nDividendes déjà reçus : ${eur(F.div)}\nPrix de vente : ${eur(v)}\nUn repreneur paie ± 5 ans de bénéfice (ou au moins un quart de ce que tu as investi, s’il perd de l’argent). Plus-value sur actions exonérée en Belgique.`,()=>euSell(k,1),{ic:C.f,ok:'Vendre',danger:1});
  mv(v,'Vente de la filiale '+C.n,'buy');st.mCapex-=v;delete fil()[k];log(`${C.f} Filiale ${C.n} vendue pour ${eur(v)}.`);save();render()}
function euUI(){const ok=euReq().every(x=>x[0]);let h=`<h3>🌍 Ouvrir une filiale en Europe</h3><p class="mut sm">Une filiale est une société à toi dans un autre pays, dirigée par un directeur local. Elle coûte très cher au départ et met ± 18 mois à tourner à plein. Ses bénéfices peuvent revenir en Belgique sans impôt en plus.</p>
  <div class="card">${euReq().map(x=>`<div class="sm" style="margin:3px 0">${x[0]?'✅':'❌'} ${x[1]}</div>`).join('')}</div>`;
  for(const k in EU){const C=EU[k],F=fil()[k],full=Math.round(C.pot*(1-C.var)-C.fix);
    h+=`<div class="card"><div class="hd"><div style="font-size:38px;line-height:1;margin-right:10px">${C.f}</div><div style="flex:1;min-width:0"><h3>${C.n}</h3><div class="mut sm">${C.d}</div></div></div>
    <div class="tags"><span class="tag">Départ ${eur(C.setup)}</span><span class="tag">Frais ${eur(C.fix)}/mois</span><span class="tag">Impôt ${(C.tax*100).toFixed(C.tax*100%1?2:0).replace('.',',')} %</span><span class="tag ${full>0?'g':'r'}">± ${eur(full)}/mois avant impôt à pleine vitesse</span></div>
    <div class="row" style="margin-top:10px">${F?'<span class="tag g">✅ Ta filiale</span>':`<button class="btn" ${ok&&st.cash>=C.setup?'':'disabled'} onclick="euOpen('${k}')">Créer la filiale</button>`}</div></div>`}
  showModal(h+'<p class="mut sm">Chiffres estimés à partir des coûts réels d’implantation (création, dépôt, machines, salaires locaux) et des impôts des sociétés 2025 de chaque pays.</p><button class="btn s w" onclick="closeM()">Fermer</button>')}
function euCard(){const F=fil(),ks=Object.keys(F);if(!ks.length&&caRecent()<500000)return'';
  let h=`<div class="card acc" style="--ac:var(--vi)"><div class="hd"><div class="ic" style="--ac2:#3d2c66">🌍</div><div style="flex:1;min-width:0"><h3>Filiales en Europe</h3><div class="mut sm">${ks.length?ks.map(k=>EU[k].f).join(' ')+' · '+ks.length+' pays':'Développe ton entreprise à l’étranger (gros investissement).'}</div></div></div>`;
  for(const k of ks){const C=EU[k],f=F[k],L=f.last;const ramp=Math.min(100,Math.round(Math.max(.08,Math.min(1,(f.m)/17))*100));
    h+=`<div style="margin-top:10px;padding-top:10px;border-top:1px solid #ffffff14"><div class="row" style="flex-wrap:nowrap"><div style="font-size:30px">${C.f}</div><div style="flex:1;min-width:0"><b>${C.n}</b> <span class="tag v">niv. ${f.lv}</span><div class="mut sm">${f.m} mois · démarrage ${ramp} %</div></div></div>
    <div class="tags">${L?`<span class="tag b">CA du mois ${eur(L.rv)}</span><span class="tag ${L.net>=0?'g':'r'}">Résultat ${L.net>=0?'+':''}${eur(L.net)}</span>`:'<span class="tag">1er bilan le 1er du mois</span>'}<span class="tag">Caisse ${eur(f.cash)}</span><span class="tag">Investi ${eur(f.inv)}</span>${f.div?`<span class="tag g">Dividendes reçus ${eur(f.div)}</span>`:''}</div>

    ${L&&L.ev?`<div class="mut sm" style="margin-top:4px">📰 ${L.ev}</div>`:''}
    <div class="row" style="margin-top:8px"><button class="btn s" style="padding:6px 9px" ${f.cash-C.fix*.5>=1000?'':'disabled'} onclick="euDiv('${k}')">💶 Rapatrier ${eur(Math.max(0,f.cash-C.fix*.5))}</button>${f.lv<3?`<button class="btn s" style="padding:6px 9px" ${f.m<18?'disabled':''} onclick="euUp('${k}')">⬆️ Agrandir (${eur(C.setup*.7*f.lv)})</button>`:''}<button class="btn s" style="padding:6px 9px" onclick="euSell('${k}')">Vendre (${eur(euVal(k))})</button></div></div>`}

function inoGo(k,ok){const P=INNO.find(x=>x.k===k),I=st.ino||(st.ino={});if(I[k])return;if(st.cls<P.lv)return toastMsg(`Il faut l’agréation ${CLS[P.lv].n.toLowerCase()}.`);if(inoRun()>=inoMax())return toastMsg(`Déjà ${inoRun()} projets en cours (maximum ${inoMax()} avec ta classe) : attends qu’un projet se termine.`);

function genJob(force){const m=month();const ok=PJ.filter(k=>inSeason(JOBS[k],m));const j=force||pick(ok),J=JOBS[j];
  const big=1+Math.min(4,field().length-1)*.5;const step=J.rate>=100?25:1;
  const q=Math.max(step,Math.round(J.rate*R(.5,2.2)*big/step)*step);
  // la journée entamée est due (déplacement, chargement, mise en place) : on facture des demi-journées complètes
  const price=Math.max(60,Math.round(Math.ceil(q/(J.rate*.5))*J.rate*.5*J.pu*R(1,1.15)/5)*5);const cl=pick(CLIENTS);
  st.jobs.push({id:st.nid++,j,q,price,dur:Math.ceil(q/J.rate)+RI(4,8),client:cl[0],ct:cl[1],town:pick(TOWNS),until:st.day+RI(3,7)});
}
function inSeason(J,m){if(!J.mo)return true;const[a,b]=J.mo;return a<=b?(m>=a&&m<=b):(m>=a||m<=b)}
function jobMiss(o){const J=JOBS[o.j];const r=[];if(!st.adm.bce)r.push('🧾 Inscription BCE');J.need.forEach(t=>{if(!(st.eq[t]>0))r.push(EQ[t].ic+' '+EQ[t].n+' ('+eur(EQ[t].p)+')')});return r}
// personnes encore disponibles (sans compter celles réservées pour des chantiers acceptés mais pas commencés)
function freeCount(){return freeW().length-st.contracts.filter(c=>c.st==='wait').reduce((a,c)=>a+JOBS[c.j].minW,0)}
function acceptJob(id){const o=st.jobs.find(x=>x.id===id);if(!o||jobMiss(o).length)return;if(freeCount()<JOBS[o.j].minW)return toastMsg('⏳ Tout le monde est déjà sur un chantier. Termine d’abord le travail en cours.');click();
  st.jobs.splice(st.jobs.indexOf(o),1);
  const N=Math.max(2,o.dur-2);
  const c={id:st.nid++,j:o.j,q:o.q,road:o.client,ct:o.ct,town:o.town,price:o.price,prog:0,vis:0,N,wd:0,startBy:st.day+3,st:'wait',crew:[],own:{},billed:0,caut:0,seed:RI(1,99999),tap:{},nRef:1};
  st.contracts.push(c);save();
  // on lance tout de suite avec l'équipe libre la plus efficace ; la fenêtre ne s'ouvre que s'il manque quelqu'un ou du matériel
  const J=JOBS[c.j],fw=freeW(c).sort((a,b)=>b.sk-a.sk),p=eqPlan(c.j,c);
  if(fw.length>=J.minW&&!p.miss.length){pickSel=fw.slice(0,J.minW).map(w=>w.id);c.own=p.own;c.rent=p.rent;c.crew=[...pickSel];c.st='run';st.sel=c.id;
    log(`🦺 C'est parti chez ${c.road} : ${J.n} (${c.crew.map(i=>st.workers.find(w=>w.id===i).n.split(' ')[0]).join(', ')}).`);snd(440,.08,'square',.04);snd(660,.12,'square',.04,.08);save();render()}
  else startUI(c.id)}

// Coefficient de vente du secteur : prix de revient direct × 1,5 (frais généraux ± 20 % + bénéfice ± 10 % + aléas)
const COEF=1.6;
function clsFor(v,nat){if(nat!=='travaux'||v<=CLS[0].max)return 0;for(let i=1;i<CLS.length;i++)if(v<=CLS[i].max)return i;return CLS.length-1}
function trueUnit(j){// prix de revient réel d'une unité principale (équipe type + machines)
  const J=JOBS[j];const crew=J.minW;const sal=crew*235;let m=0;J.need.forEach(k=>m+=EQ[k].u);return(sal+m+40)/(J.rate*crew*.9)}
function genTender(forceJob,urgent){
  const m=month(),ok=SPWJ.filter(k=>inSeason(JOBS[k],m));const j=forceJob||pick(ok),J=JOBS[j];
  const big=st.cls>=1||st.stats.ca>150000,r=Math.random();
  const proc=urgent?'fm':r<.45?'fm':r<(big?.75:.85)?'pn':'po';
  let V=proc==='fm'?R(6000,29500):proc==='pn'?R(30000,142000):R(143000,big?(st.cls>=1?1200000:450000):300000);if(proc==='po'&&st.cls>=3&&Math.random()<.35)V=R(1500000,st.cls>=4?14000000:5200000);
  // invitation : en faible montant et négociée, il faut être invité
  if(proc!=='po'){const pInv=.3+st.rep/140+(has('dirc')?.25:0)+(st.stats.spw>0?.1:0);if(!urgent&&Math.random()>pInv)return}
  // montant maximum réaliste d'un lot pour ce type de travaux
  const VMAX={affiches:80000,batraciens:100000,abribus:150000,poubelles:150000,tags:150000,grilles:200000,accident:200000,bornes:200000,panneaux_pose:300000,ronds:250000,ravel:300000,depots_sel:300000,pmr:600000,gabions:600000,bermes:800000,falaises:700000,cloture:700000,plantations:400000,egouts:500000,pontage:500000,feuillesspw:300000,haies_spw:400000,ruisseaux:400000,epareuse_auto:700000,souches:150000,desherbspw:200000,enherb:300000,trottoirs:600000,bassins:500000,talus:500000,lavage:400000,autoroute:900000,tunnels:700000,marq_auto:1500000,deneig_auto:1200000,balay_auto:700000,aires:150000,panneaux:150000,invasives:200000,abattage:300000,glissieres:300000,avaloirs:300000,dechets:400000,balayage:400000,elagage:400000,debrous:500000,fosses:500000,fauchage:600000,marquage:600000,deneig:600000,nids:800000,glis_pose:1200000};
  V=Math.min(V,(VMAX[j]||400000)*(st.cls>=4?10:st.cls>=3?4:1));
  const q=Math.max(J.q0,Math.round(V/(trueUnit(j)*COEF)));
  const nRef=Math.min(Math.max(J.minW,V>1.4e6?40:8),Math.max(J.minW,Math.ceil(q/(J.rate*(V>1.4e6?160:90)))));
  const N=Math.ceil(q/(J.rate*nRef)*R(1.25,1.5))+3;
  const B=pick(BUYERS);const postes=[];
  const tu=trueUnit(j);postes.push({d:J.main,u:J.un,q,ref:+(tu*COEF).toFixed(2),c:tu});
  if(J.ex)postes.push({d:J.ex.d,u:J.ex.u,q:Math.max(1,Math.round(q*J.ex.k)),ref:J.ex.pu,c:J.ex.c});
  postes.push({d:'Signalisation de chantier (mise en place, maintien, enlèvement)',u:'jour',q:Math.ceil(N*.8),ref:J.need.includes('fleche')?135:80,c:J.need.includes('fleche')?105:62});
  const est=Math.round(postes.reduce((a,p)=>a+p.q*p.ref*R(.95,1.08),0)/10)*10;
  const crit=proc==='po'&&Math.random()<.4?'pvt':'prix';
  const bidEnd=st.day+(urgent?3:RI(10,20)),dec=bidEnd+(proc==='po'?RI(15,25):RI(5,12));
  st.tenders.push({id:st.nid++,j,q,est,N,nRef,postes,proc,crit,buyer:B[0],ref:`MI/${B[1]}/${date(st.day).getFullYear()}/${String(RI(100,980)).padStart(4,'0')}`,road:pick(B[2]),town:pick(B[3]),
    bidEnd,dec,status:'open',my:null,bids:null,cls:clsFor(est,J.nat),caut:est>50000,urgent:!!urgent,noise:R(-.15,.15)});
}

function spwReq(t){const J=JOBS[t.j];const r=[];const fw=field();
  r.push({ok:!!st.adm.bce,tx:'🧾 BCE'});r.push({ok:!!st.adm.rc,tx:'🛡️ RC pro'});r.push({ok:!!st.adm.vca,tx:'🦺 VCA'});

  else if(t.proc==='pn'&&t.est>60000)r.push({ok:(st.refs[t.j]||0)>=1,tx:`📁 1 référence similaire (${st.refs[t.j]||0})`});
  r.push({ok:fw.length>=J.minW,tx:`👷 ${J.minW} personnes sur chantier`});
  if(J.pc)r.push({ok:hasPC(fw),tx:'🪪 Permis C'});if(J.op)r.push({ok:fw.some(w=>w.r===J.op),tx:"🦾 Conducteur d'engins"});if(J.gr)r.push({ok:fw.some(w=>w.r==='grimp'),tx:'🧗 Élagueur-grimpeur'});
  for(const k of J.need)r.push({ok:(st.eq[k]||0)>0,tx:EQ[k].ic+' '+EQ[k].n});

function freeEq(t,ex){let u=0;for(const c of st.contracts)if(c.st==='run'&&c!==ex)u+=(c.own[t]||0);return(st.eq[t]||0)-u}
function freeW(ex){const busy=new Set();for(const c of st.contracts)if(c.st==='run'&&c!==ex)c.crew.forEach(i=>busy.add(i));return field().filter(w=>!busy.has(w.id))}
// Location chez un loueur (Boels, Loxam…) quand ta machine est déjà prise : tarifs journaliers HTVA (estimations des tarifs publics, sans chauffeur)
const RENT={aspifeuilles:70,rogneuse:120,rouleau:110,tondap:130,desherb:190,chargeuse:170,fourgon:110,hydroseed:220,telesc:240,tma:420,laveuse:650,balaygr:700,epandeur:600,tunnel:900,marqauto:1100,taillehaie:30,souffleur:30,debrou:35,tondeuse:40,remorque:35,signal:25,karcher:75,fleche:60,broyeur:140,van:95,nacelle:250,balayeuse:420,tracteur:380,hydro:550,trons:35,plaque:45,batteuse:90,benne:110,pelle:160,traceuse:180,saleuse:150,benne19:350};
function eqPlan(j,ex){const own={},rent={},miss=[];let day=0;for(const t of JOBS[j].need){if(freeEq(t,ex)>0){own[t]=1;day+=EQ[t].u}else if(RENT[t]){rent[t]=1;day+=RENT[t]+EQ[t].u}else miss.push(t)}return{own,rent,miss,day}}

function seenCost(t,p){const f=has('metreur')?1:1+t.noise;return p.c*f}
function realCost(t){return t.postes.reduce((a,p)=>a+p.q*p.c,0)}
function bidTotal(pu,t){return t.postes.reduce((a,p,i)=>a+p.q*(pu[i]||0),0)}

const patSal=()=>{const V=pv();if(V.sal===undefined)V.sal=1800;return V.sal};
const patronCost=()=>st.adm&&st.adm.bce?Math.round(st.srl?patSal()/.55:patSal()):0;
function paySalary(){if(!st.adm.bce)return;const net=patSal();if(!net)return;const cost=patronCost();const V=pv();
  const room=st.cash+overdraft();if(cost>15000&&cost>canPay()){pEv(`⚠️ Salaire non versé : ta société doit garder 3 mois de charges (test de liquidité). Baisse ton salaire.`,0,true);log(`⚠️ Ton salaire de ${eur(net)} n'est pas versé : la société doit garder 3 mois de charges (test de liquidité).`);return}if(room<cost){pEv(`⚠️ La société n'a pas pu te verser ton salaire (compte trop bas).`,0,true);log(`⚠️ La société n'a pas pu te verser ton salaire (${eur(net)}) : le compte est trop bas.`);return}
  mv(-cost,st.srl?'Rémunération du dirigeant (toi)':'Ton salaire (prélèvement)',st.srl?'sal':'priv');if(!st.srl)st.mCapex+=cost;V.cash+=net;V.tr=(V.tr||0)+net;outLog(cost,0);pEv(`💶 Ton salaire de ${eur(net)} est versé sur ton compte privé.`,0)}

// Test de liquidité (Code des sociétés, art. 5:143) : la société garde de quoi payer 3 mois de charges avant de verser plus au patron
const reserve=()=>Math.round(3*(fixedM()+payroll()*WDM));
const canPay=()=>Math.max(0,Math.round(st.cash-reserve()));
const outLog=(a,x)=>{const V=pv();(V.outs||(V.outs=[])).push({d:st.day,a:Math.round(a),x:x?1:0});V.outs=V.outs.filter(o=>st.day-o.d<=200)};
// Période suspecte (Code de droit économique, art. XX.111-112) : en cas de réorganisation ou de faillite, le tribunal récupère
// les versements anormaux des 6 derniers mois ; un indépendant en personne physique répond des dettes avec ses biens privés.
function clawback(){const V=pv();let r=0,why='';
  if(st.srl){r=(V.outs||[]).filter(o=>st.day-o.d<=183).reduce((a,o)=>a+(o.x?o.a:Math.max(0,o.a-10000)),0);why='versements anormaux au patron pendant la période suspecte (6 mois)'}
  else{r=Math.max(0,Math.round(-st.cash+5000));why='tu es indépendant en personne physique : tes biens privés répondent des dettes de l’entreprise'}
  r=Math.min(r,Math.max(0,Math.round(V.cash)));
  if(r<=0)return 0;V.cash-=r;V.outs=[];mv(r,'Récupéré sur ton compte privé par le tribunal','other');st.mCapex-=r;
  pEv(`⚖️ Le tribunal reprend ${eur(r)} sur ton compte privé : ${why}.`,-r,true);log(`⚖️ Le tribunal récupère ${eur(r)} sur ton compte privé (${why}).`);return r}

// loyer d'un bien : immeuble de rapport (P.rent) ou logement mis en location (P.hr), indexé chaque année
function rentOf(o){const P=PRIV[o.k];if(!P)return 0;const r=P.rent||(o.lou?P.hr:0);return r?Math.round(r*(o.ix||1)):0}
function pRent(id,ok){const V=pv(),o=V.own.find(x=>x.id===id);if(!o)return;const P=PRIV[o.k];if(!P||!P.hr)return;click();
  if(!o.lou){const only=P.home&&myHome()===o;
    if(!ok)return ask(`Mettre en location ?\nBien : ${P.n.replace(/ \(.*$/,'')}\nLoyer : ${eur(Math.round(P.hr*(o.ix||1)))}/mois\nCharges (toujours pour toi) : ${eur(P.m)}/mois\nLocataire trouvé : en ± 1 mois\nBail : 9 ans\n${P.hrn?'C’est une '+P.hrn+'. ':''}Pour récupérer le bien, il faut envoyer un préavis de 6 mois au locataire (occupation personnelle).${only?'\n⚠️ C’est ta seule maison : tu devras louer ailleurs. Ta vie courante repasse de 850 à 1 650 €/mois.':''}`,()=>pRent(id,1),{ic:'🔑',ok:'Mettre en location',img:photo(o.k)});
    o.lou=1;o.louFrom=st.day+30;delete o.louEnd;delete o.louOk;pEv(`🔑 ${P.n} : mis en location, l’agence cherche un locataire.`)}
  else if(o.louEnd){return toastMsg(`Préavis en cours : le locataire part le ${dstr(o.louEnd)} ${date(o.louEnd).getFullYear()}.`)}
  else if(st.day<o.louFrom){delete o.lou;delete o.louFrom;pEv(`🏠 ${P.n} : location annulée, pas encore de locataire.`)}
  else{if(!ok)return ask(`Récupérer ton bien ?\nBien : ${P.n.replace(/ \(.*$/,'')}\nPréavis : 6 mois\nDépart du locataire : ${dstr(st.day+182)} ${date(st.day+182).getFullYear()}\nTu envoies un préavis par recommandé (occupation personnelle). Le locataire paie son loyer jusqu’à son départ.`,()=>pRent(id,1),{ic:'📨',ok:'Envoyer le préavis'});o.louEnd=st.day+182;pEv(`📨 Préavis envoyé au locataire de ${P.n} : départ le ${dstr(o.louEnd)} ${date(o.louEnd).getFullYear()}.`)}
